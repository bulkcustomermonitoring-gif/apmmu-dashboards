<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root, :root[data-theme="dark"], :root[data-theme="light"] {
  color-scheme: light;
  --paper: #f5f7fb;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --ink: #0f172a;
  --ink-2: #475569;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-2: #eef2f6;
  --navy: #1e3a5f;
  --ip-red: #e0132b;
  --ip-gold: #f7a800;
  --accent: #e0132b;
  --accent-ink: #ffffff;
  --bar: #0ea5e9;
  --bar-soft: #e0f2fe;
  --focus: #0ea5e9;
  --acc: #0ea5e9; --acc-tint: #e0f2fe;
  --good: #059669;  --good-tint: #d1fae5;  --good-ink: #047857;
  --warn: #d97706;  --warn-tint: #fef3c7;  --warn-ink: #92400e;
  --crit: #e0132b;  --crit-tint: #fee2e5;  --crit-ink: #b91c1c;
  --none-tint: #f1f5f9;
  --shadow: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
  --radius: 10px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-d: 'Inter Tight', 'Inter', system-ui, sans-serif;
}
body[data-acc="ov"]    { --acc: #0ea5e9; --acc-tint: #e0f2fe; }
body[data-acc="dpr"]   { --acc: #059669; --acc-tint: #d1fae5; }
body[data-acc="ni"]    { --acc: #475569; --acc-tint: #f1f5f9; }
body[data-acc="una"]   { --acc: #7c3aed; --acc-tint: #ede9fe; }
body[data-acc="dta"]   { --acc: #d97706; --acc-tint: #fef3c7; }
body[data-acc="dma"]   { --acc: #8b5cf6; --acc-tint: #f3e8ff; }
body[data-acc="fmtd"]  { --acc: #0d9488; --acc-tint: #ccfbf1; }
body[data-acc="fmntd"] { --acc: #c2410c; --acc-tint: #ffedd5; }
body[data-acc="rr"]    { --acc: #db2777; --acc-tint: #fce7f3; }
body[data-acc="adm"]   { --acc: #1e3a5f; --acc-tint: #e2e8f0; }
body[data-acc] { --bar: var(--acc); --focus: var(--acc); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 14px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 700; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── Buttons & controls ──────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-run { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-run:hover { filter: brightness(1.07); border-color: var(--accent); }
.btn-quiet { border-color: transparent; background: transparent; }
.btn-quiet:hover { background: var(--surface-2); border-color: var(--line); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 13px; }
select, input[type=search], input[type=text], input[type=number], input[type=password] {
  height: 34px; padding: 0 10px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); min-width: 0;
}
input[type=number] { width: 72px; text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 14px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--acc); color: #fff; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); cursor: pointer; }

/* ── Run screen: the sorting rack ────────────────────────── */
.run { max-width: 1120px; margin: 0 auto; padding: 32px 16px 56px; }
.run-head { display: flex; gap: 24px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 22px; }
.run-head h1 { font-size: 30px;  letter-spacing: -.01em; line-height: 1.1; }
.run-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 60ch; }
.org { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.rack {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  border: 2px solid var(--ink); border-radius: 4px; background: var(--surface);
}
.hole {
  position: relative; min-height: 168px; padding: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.hole:nth-child(4n) { border-right: 0; }
.hole:nth-last-child(-n+4) { border-bottom: 0; }
.plate {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 8px 12px; background: var(--ink); color: var(--surface);
  font-weight: 700;  font-size: 15px;
}
.plate small { font-weight: 500; font-stretch: 100%; font-size: 11.5px; opacity: .8; }
.hole-body { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 6px; background:
  repeating-linear-gradient(180deg, transparent 0 22px, var(--line-2) 22px 23px); }
.hole-empty { color: var(--muted); font-size: 13px; margin: auto 0; }
.letter {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--good);
  border-radius: 3px; padding: 8px 10px; box-shadow: var(--shadow);
}
.letter b { display: block; font-size: 13px; word-break: break-all; }
.letter span { font-size: 12px; color: var(--ink-2); }
.letter.need { border-left-color: var(--warn); }
.hole .req { position: absolute; right: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted); }
.hole.is-drop { outline: 2px dashed var(--bar); outline-offset: -6px; }
.fm-pick { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 4px; }
.run-actions { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; margin-top: 18px; }
.run-actions .left { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
.run-actions label.date { display: inline-flex; gap: 8px; align-items: center; color: var(--ink-2); }
.run-actions input[type=text] { width: 120px; }
.dropzone-note { margin-top: 14px; color: var(--muted); font-size: 13px; }
.progress { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); font-size: 13px; }
.progress ol { margin: 0; padding-left: 18px; }
.progress li.done { color: var(--good-ink); }
.progress li.err { color: var(--crit-ink); }

/* ── App shell: header, tab bar, scope bar ───────────────── */
.top {
  background: #fff; border-bottom: 1px solid var(--line); position: relative;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 12px 24px;
}
.top::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--ip-red) 0 60%, var(--ip-gold) 60%); }
.hdr-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { width: 54px; height: 54px; border-radius: 12px; background: #fff; border: 2px solid var(--ip-red); color: var(--ip-red); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-d); font-weight: 800; font-size: 15px; line-height: 1; flex: none; }
.logo span { font-size: 9.5px; margin-top: 3px; color: var(--navy); letter-spacing: .04em; }
.hdr-text h1 { font-family: var(--font-d); font-size: 21px; font-weight: 800; color: var(--navy); letter-spacing: -.01em; line-height: 1.2; }
.hdr-text p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hdr-report, .hdr-clock { display: flex; flex-direction: column; align-items: flex-end; padding: 4px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); line-height: 1.25; }
.hdr-report span, .hdr-clock span { font-size: 11px; color: var(--muted); }
.hdr-report b { font-size: 14px; color: var(--ip-red); }
.hdr-clock b { font-size: 14px; color: var(--navy); font-variant-numeric: tabular-nums; }
.hdr-report { align-items: flex-start; }
.btn-gold { background: var(--ip-gold); border-color: var(--ip-gold); color: #3b2600; }
.btn-gold:hover { border-color: #d48f00; filter: brightness(1.03); }
.btn-acc { background: var(--acc); border-color: var(--acc); color: #fff; }
.btn-acc:hover { filter: brightness(1.06); border-color: var(--acc); }

.shell { display: block; }
.nav { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(15,23,42,.03); }
.tabs { display: flex; overflow-x: auto; gap: 2px; padding: 0 16px; scrollbar-width: thin; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 13px 14px 11px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.tab .ti { font-size: 15px; }
.tab:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); }
.tab:disabled { opacity: .45; cursor: not-allowed; }
.tab[aria-current="page"] { color: var(--tc); border-bottom-color: var(--tc); background: color-mix(in srgb, var(--tc) 7%, transparent); }
.tab.acc-ov { --tc: #0284c7; } .tab.acc-dpr { --tc: #059669; } .tab.acc-ni { --tc: #475569; } .tab.acc-una { --tc: #7c3aed; }
.tab.acc-dta { --tc: #d97706; } .tab.acc-dma { --tc: #8b5cf6; } .tab.acc-fmtd { --tc: #0d9488; } .tab.acc-fmntd { --tc: #c2410c; } .tab.acc-adm { --tc: #1e3a5f; } .tab.acc-rr { --tc: #db2777; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.crit { background: var(--crit); } .dot.warn { background: var(--warn); } .dot.good { background: var(--good); }
.scopebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 24px; border-top: 1px solid var(--line-2); background: #fbfcfe; font-size: 13px; }
.scopebar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; }
.scopebar select { height: 32px; }
.scope-note { color: var(--ink-2); }
.scopebar .grow { flex: 1; }

main { padding: 22px 24px 60px; max-width: 1480px; margin: 0 auto; min-width: 0; }
.sec-hd, .view-head { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; padding: 2px 0 2px 14px; border-left: 4px solid var(--acc); }
.sec-hd h2, .view-head h2 { font-family: var(--font-d); font-size: 22px; font-weight: 800; color: var(--acc); letter-spacing: -.01em; line-height: 1.2; }
.sec-hd h2 small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 8px; }
.sec-hd p, .view-head p { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; width: 100%; }
.view-head p { width: auto; }
.sub-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px; }
.sub-tab { border: 1px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.sub-tab:hover { border-color: var(--acc); color: var(--acc); }
.sub-tab[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; box-shadow: 0 1px 4px color-mix(in srgb, var(--acc) 35%, transparent); }
.ov-label { font-family: var(--font-d); font-weight: 700; font-size: 13.5px; color: var(--navy); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
.ov-label:first-of-type { margin-top: 4px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.card-head h3 { font-size: 16px; }
.card-title, .half-hd { font-size: 14px; font-weight: 700; color: var(--navy); margin: 0 0 8px; }
.cat-card { background: #fff; border: 1px solid var(--line); border-top: 3px solid var(--acc); border-radius: var(--radius); padding: 12px 14px 4px; margin-bottom: 14px; box-shadow: var(--shadow); }
.cat-card-hd { font-weight: 700; color: var(--navy); margin-bottom: 10px; }
.cat-card .panel { box-shadow: none; }
.tbl-card { border-top: 3px solid var(--acc); }
.tbl-title { color: var(--navy); font-size: 14px; }
.section { margin-top: 24px; }
.section > h3 { font-family: var(--font-d); font-size: 16px; color: var(--navy); margin-bottom: 4px; }
.section > .sub, .sub { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-pad { padding: 14px 16px; }
.note { padding: 10px 14px; border-radius: var(--radius); background: var(--warn-tint); color: var(--warn-ink); font-size: 13px; margin-bottom: 12px; border: 1px solid #fde68a; }
.note.info { background: #f0f9ff; color: #075985; border-color: #bae6fd; }
.note b { color: inherit; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* ── Tiles ───────────────────────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--acc); border-radius: var(--radius); padding: 12px 14px; min-width: 0; box-shadow: var(--shadow); }
.tile.link { cursor: pointer; text-align: left; width: 100%; }
.tile.link:hover { border-color: var(--acc); transform: translateY(-1px); }
.tile .lbl { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.tile .val { font-family: var(--font-d); color: var(--navy); font-size: 28px; font-weight: 800; line-height: 1.1; margin-top: 4px; letter-spacing: -.01em; }
.tile .val small { font-size: 15px; font-weight: 600; }
.tile .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.delta { font-size: 12px; font-weight: 600; }
.delta.up { color: var(--good-ink); } .delta.down { color: var(--crit-ink); } .delta.flat { color: var(--muted); }

/* ── Status chip (icon + label + color) ──────────────────── */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.chip::before { font-size: 10px; }
.chip.crit { background: var(--crit-tint); color: var(--crit-ink); } .chip.crit::before { content: '▼'; }
.chip.warn { background: var(--warn-tint); color: var(--warn-ink); } .chip.warn::before { content: '◆'; }
.chip.good { background: var(--good-tint); color: var(--good-ink); } .chip.good::before { content: '●'; }

/* ── Scorecard ───────────────────────────────────────────── */
.score { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 13px; }
.score th { font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 6px 8px; text-align: right; white-space: nowrap; }
.score th:first-child { text-align: left; }
.score td { padding: 6px 8px; text-align: right; border-radius: 3px; white-space: nowrap; }
.score td:first-child { text-align: left; font-weight: 600; background: transparent; padding-left: 4px; }
.score td.c { cursor: pointer; }
.score td.c:hover { box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.score td.crit { background: var(--crit-tint); color: var(--crit-ink); font-weight: 600; }
.score td.warn { background: var(--warn-tint); color: var(--warn-ink); }
.score td.good { background: var(--good-tint); color: var(--good-ink); }
.score td.na { color: var(--muted); background: var(--none-tint); }
.score tr.rg td { font-weight: 700; border-top: 0; }
.score tr.rg td:first-child {  padding-top: 12px; }
.score tr.tot td { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ── Distribution bars (categorization summary) ──────────── */
.dist { display: grid; grid-template-columns: 150px minmax(0,1fr) 64px; gap: 8px 12px; align-items: center; }
.dist .name { font-weight: 600; font-size: 13px; }
.dist .name small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.dist .tot { text-align: right; font-size: 12.5px; color: var(--ink-2); }
.stack { display: flex; height: 18px; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--surface); }
.stack span { display: block; height: 100%; min-width: 2px; position: relative; }
.stack span:hover { filter: brightness(1.08); }

/* ── Division bars ───────────────────────────────────────── */
.bars { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0,1fr) 72px 92px; gap: 6px 10px; align-items: center; font-size: 13px; }
.bars .bn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .bn small { color: var(--muted); margin-left: 4px; }
.track { position: relative; height: 14px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.fill { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--bar); border-radius: 0 4px 4px 0; }
.tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.tick.w { opacity: .3; }
.bars .bv { text-align: right; font-weight: 600; }
.bars-legend { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.bars-legend .tk { display: inline-block; width: 2px; height: 12px; background: var(--ink); opacity: .55; margin-right: 5px; vertical-align: -2px; }
.bars-legend .tk.w { opacity: .3; }
.track.dots { background: transparent; border-radius: 0; }
.track.dots::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.dotm { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--bar); box-shadow: 0 0 0 2px var(--surface); }
.track:hover .dotm { transform: scale(1.25); }
.axis { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
.axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.bars-legend .dotk { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--bar); margin-right: 5px; vertical-align: -1px; }

/* ── Column chart (ageing / day-wise) ────────────────────── */
.cols { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding: 8px 4px 0; border-bottom: 1px solid var(--line); }
.col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
.col .cb { width: 100%; max-width: 56px; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 1px; }
.col .cv { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.col-labels { display: flex; gap: 10px; padding: 4px 4px 0; }
.col-labels span { flex: 1; text-align: center; font-size: 12px; color: var(--ink-2); min-width: 0; }

/* ── Data tables ─────────────────────────────────────────── */
.tbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbar .grow { flex: 1; }
.tbar .count { font-size: 12.5px; color: var(--muted); }
.tscroll { overflow: auto; max-height: 70vh; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  position: sticky; top: 0; z-index: 1; background: #f1f5f9; color: var(--navy);
  font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
  white-space: nowrap; cursor: pointer; user-select: none;
}
table.data th.num { text-align: right; }
table.data th[aria-sort="ascending"]::after { content: ' ↑'; }
table.data th[aria-sort="descending"]::after { content: ' ↓'; }
table.data td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.data tbody tr:nth-child(even) td { background: #fafbfd; }
table.data tbody tr:hover td { background: var(--acc-tint); }
table.data tr.tot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line); }
table.data td.primary { font-weight: 700; }
.mini { display: inline-block; vertical-align: middle; width: 54px; height: 6px; background: var(--surface-2); border-radius: 3px; margin-right: 8px; position: relative; overflow: hidden; }
.mini i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 3px; }
.pager { display: flex; gap: 6px; align-items: center; justify-content: flex-end; padding: 8px 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

/* ── Categorization matrix ───────────────────────────────── */
table.cat { border-collapse: separate; border-spacing: 2px; font-size: 12.5px; width: 100%; }
table.cat th { font-weight: 600; color: var(--ink-2); padding: 6px; text-align: right; white-space: nowrap; font-size: 12px; }
table.cat th:first-child { text-align: left; }
table.cat th .sw { display: block; height: 4px; border-radius: 2px; margin-bottom: 4px; }
table.cat td { padding: 5px 6px; text-align: right; border-radius: 3px; }
table.cat td:first-child { text-align: left; }
table.cat tr.rg td { font-weight: 700; padding-top: 10px; }
table.cat tr.tot td { font-weight: 700; border-top: 1px solid var(--line); }
table.cat td.z { color: var(--line); }

/* ── Layout helpers ──────────────────────────────────────── */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.targets { width: 100%; border-collapse: collapse; font-size: 13px; }
.targets th, .targets td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; }
.targets td input { margin-right: 4px; }

/* ── Tooltip ─────────────────────────────────────────────── */
#tip {
  position: fixed; z-index: 100; pointer-events: none; max-width: 280px;
  background: #0f172a; color: #fff; padding: 8px 10px; border-radius: 6px;
  font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0,0,0,.18); opacity: 0; transition: opacity .08s;
}
#tip.on { opacity: 1; }
#tip b { font-weight: 700; }

/* ── Trend lines ─────────────────────────────────────────── */
.trend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.trend { padding: 10px 12px; }
.trend .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; }
.trend svg { width: 100%; height: 70px; display: block; margin-top: 6px; overflow: visible; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: var(--radius); font-size: 13px; z-index: 200; }

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width: 960px) {
  .rack { grid-template-columns: repeat(2, 1fr); }
  .hole:nth-child(4n) { border-right: 1px solid var(--line); }
  .hole:nth-child(2n) { border-right: 0; }
  .hole:nth-last-child(-n+4) { border-bottom: 1px solid var(--line); }
  .hole:nth-last-child(-n+2) { border-bottom: 0; }
  .grid2 { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 600px) {
  .rack { grid-template-columns: 1fr; }
  .hole { border-right: 0 !important; border-bottom: 1px solid var(--line) !important; }
  .hole:last-child { border-bottom: 0 !important; }
  main { padding: 14px 16px 50px; }
  .top { padding: 12px 16px; }
  .scopebar { padding: 8px 16px; }
  .tabs { padding: 0 8px; }
  .hdr-clock { display: none; }
  .hdr-text h1 { font-size: 17px; }
  .bars { grid-template-columns: minmax(80px, 110px) minmax(0,1fr) 58px; }
  .bars .bs { display: none; }
  .dist { grid-template-columns: 1fr 52px; }
  .dist .stack { grid-column: 1 / -1; grid-row: 2; }
  .run-head h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .nav, .tbar, .pager, .sub-nav, .hdr-right { display: none; } .shell { display: block; } .tscroll { max-height: none; } }

/* ── Admin forms ─────────────────────────────────────────── */
.form { display: grid; gap: 12px; }
.form label:not(.check) { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form input[type=text], .form input[type=password] { width: 100%; font-weight: 400; color: var(--ink); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-msg { font-size: 13px; color: var(--ink-2); min-height: 1em; }
.form-msg.err { color: var(--crit-ink); font-weight: 600; }
#run .view-head h2 { font-size: 28px; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

.welcome-drop { margin-top: 18px; border: 2px dashed var(--ink-2); border-radius: 8px; background: var(--surface); padding: 56px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; text-align: center; }
.welcome-drop b { font-size: 20px;  color: var(--ink); }
.welcome-drop span { color: var(--muted); font-size: 13px; }
.welcome-drop:hover, .welcome-drop:focus-visible { border-color: var(--accent); }

.welcome-drop.small { padding: 26px 20px; border-style: dashed; border-color: var(--line); }
.welcome-drop.small b { font-size: 15px; }
.admin-link { margin-top: 28px; text-align: right; }
ol.steps { margin: 10px 0 0; padding-left: 18px; line-height: 1.7; font-size: 13px; }
ol.steps li { margin-bottom: 8px; }
.site-status { margin-top: 8px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.grid2 > * { min-width: 0; }

/* ── Returns & redirects ─────────────────────────────────── */
table.data td.rr-crit { background: var(--crit-tint) !important; color: var(--crit-ink); font-weight: 700; }
table.data td.rr-warn { background: var(--warn-tint) !important; color: var(--warn-ink); font-weight: 600; }
table.data td.rr-none { color: var(--muted); }
.dotm.crit { background: var(--crit); } .dotm.warn { background: var(--warn); } .dotm.good { background: var(--good); }
.rr-limits { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); background: #fff; border: 1px dashed var(--line); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 12px; }
.rr-limits b { color: var(--navy); }
.tile-rr { border-top-color: #db2777 !important; }
td .chip + .chip { margin-left: 2px; }
table.data td .chip { font-size: 11px; }

/* ── Clickable numbers and the office list window ────────── */
.dz { cursor: pointer; border-bottom: 1px dashed color-mix(in srgb, currentColor 45%, transparent); }
.dz:hover, .dz:focus-visible { color: var(--acc); border-bottom-color: var(--acc); outline: none; }
.stack span[data-drill] { cursor: pointer; }
.drill-wrap { position: fixed; inset: 0; z-index: 150; background: rgba(15,23,42,.42); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; }
.drill { background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(15,23,42,.3); width: min(1280px, 100%); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; border-top: 4px solid var(--acc); }
.drill-hd { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.drill-hd h3 { font-family: var(--font-d); font-size: 18px; color: var(--navy); margin: 2px 0; }
.drill-hd p { margin: 0; color: var(--ink-2); font-size: 13px; }
.drill-kind { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--acc); }
.drill-x { font-size: 18px; height: 34px; width: 34px; justify-content: center; padding: 0; }
.drill-body { max-height: none; flex: 1; }
body.drill-open { overflow: hidden; }

/* ── Scorecard tables ────────────────────────────────────── */
.sc-card { margin-bottom: 14px; overflow: hidden; }
.sc-cap { padding: 10px 14px; font-weight: 700; color: var(--navy); border-bottom: 1px solid var(--line); background: #fbfcfe; }
.sc-cap .muted { font-weight: 500; font-size: 12.5px; }
table.sc th { text-align: center; border-left: 1px solid var(--line); }
table.sc th:first-child { border-left: 0; }
table.sc thead tr:first-child th.grp { background: #e8eef6; color: var(--navy); }
table.sc thead tr:nth-child(2) th { top: 33px; }
table.sc td { border-left: 1px solid var(--line-2); }
table.sc td:first-child { border-left: 0; }
table.sc td.b { font-weight: 600; }
table.sc td.sc-crit { background: var(--crit-tint) !important; color: var(--crit-ink); font-weight: 700; }
table.sc td.sc-warn { background: var(--warn-tint) !important; color: var(--warn-ink); font-weight: 600; }
table.sc td.sc-good { background: var(--good-tint) !important; color: var(--good-ink); }
table.sc td.na { color: var(--muted); text-align: center; }

/* ── Horizontal bars ─────────────────────────────────────── */
.hb { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0,1fr) 74px 104px; gap: 7px 10px; align-items: center; font-size: 13px; }
.hb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; line-height: 1.15; }
.hb-name small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
.hb-track { position: relative; height: 18px; background: #eef2f7; border-radius: 4px; }
.hb-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--bar); }
.hb-fill.good { background: #10b981; } .hb-fill.warn { background: #f59e0b; } .hb-fill.crit { background: #ef4444; } .hb-fill.cnt { background: var(--acc); }
.hb-line { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #0f172a; }
.hb-val { text-align: right; font-weight: 700; }
.hb-key { display: inline-block; width: 2px; height: 12px; background: #0f172a; margin-right: 6px; vertical-align: -2px; }
.bars-legend .lg { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.lg.good { background: #10b981; } .lg.warn { background: #f59e0b; } .lg.crit { background: #ef4444; }
@media (max-width: 600px) { .hb { grid-template-columns: minmax(80px, 110px) minmax(0,1fr) 62px; } .hb-st { display: none; } }

/* ── Trend columns ───────────────────────────────────────── */
.tcols { display: flex; align-items: flex-end; gap: 3px; height: 70px; margin: 8px 0 4px; border-bottom: 1px solid var(--line); }
.tc { flex: 1; height: 100%; display: flex; align-items: flex-end; }
.tc div { width: 100%; background: color-mix(in srgb, var(--acc) 45%, #fff); border-radius: 2px 2px 0 0; }
.tc.last div { background: var(--acc); }

/* ── Main header: deep peacock blue, as in the first dashboard ─ */
.top { background: linear-gradient(120deg, #1E3A5F 0%, #16305A 45%, #0F2348 100%); border-bottom: 3px solid var(--ip-gold); box-shadow: 0 3px 12px rgba(15,23,42,.30); color: #fff; }
.top::before { display: none; }
.top .logo { background: #fff; border: 0; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.top .hdr-text h1 { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.3); }
.top .hdr-text p { color: rgba(255,255,255,.72); }
.top .hdr-report { background: var(--ip-gold); border-color: var(--ip-gold); box-shadow: 0 2px 6px rgba(247,168,0,.35); }
.top .hdr-report span { color: #1E3A5F; opacity: .8; }
.top .hdr-report b { color: #1E3A5F; }
.top .hdr-clock { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.22); }
.top .hdr-clock b { color: #fff; }
.top .hdr-clock span { color: rgba(255,255,255,.75); }
.top .btn { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.35); color: #fff; }
.top .btn:hover { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.5); }
.top .btn-gold { background: var(--ip-gold); border-color: var(--ip-gold); color: #1E3A5F; font-weight: 800; }
.top .btn-gold:hover { background: #ffb81f; border-color: #ffb81f; }

/* ── Report dates and DTR parts ──────────────────────────── */
.tdate { font-size: 11px; color: var(--muted); margin-top: 1px; }
.part-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 12px; }
.part-tab { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 1.5px solid var(--line); background: #fff; color: var(--navy); border-radius: 10px; padding: 8px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.part-tab small { font-weight: 500; font-size: 11.5px; color: var(--muted); }
.part-tab:hover { border-color: var(--acc); }
.part-tab[aria-pressed="true"] { border-color: var(--acc); background: var(--acc-tint); box-shadow: inset 0 -3px 0 var(--acc); }
</style>
</head>

<script>// Hosted copy of the dashboard: reads the figures from the Apps Script web app.
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyZnFjirBL9HsvDfzrgP26yHYpVFjwzKAuQiUfGtNtmf8gBz6k-3T6dAEfoCsXZkakReQ/exec';
  function pageUrl() { return location.href.split('#')[0].split('?')[0]; }
  function jsonp(url) {
    return new Promise(function (ok, no) {
      var cb = '__dpdFeed' + new Date().getTime(), s = document.createElement('script');
      var t = setTimeout(function () { done(); no(new Error('Google did not answer in time.')); }, 90000);
      function done() { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function (d) { done(); ok(d); };
      s.onerror = function () { done(); no(new Error('The figures could not be loaded from Google (script.google.com). Check that this network can reach Google, or open the dashboard link directly')); };
      s.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'action=data&callback=' + cb + '&t=' + new Date().getTime();
      document.head.appendChild(s);
    });
  }
  function load() {
    var direct = window.fetch ? fetch(API + '?action=data&t=' + new Date().getTime(), { credentials: 'omit' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }) : Promise.reject(new Error('no fetch'));
    return direct.catch(function () { return jsonp(API); }).then(function (d) {
      if (!d || d.error) throw new Error((d && d.error) || 'No data in the answer from Google.');
      d.appUrl = pageUrl();
      return d;
    });
  }
  function runner(ok, fail) {
    return {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); },
      getDashboardData: function () { load().then(function (d) { if (ok) ok(d); }, function (e) { if (fail) fail(e); }); }
    };
  }
  window.DPD_HOSTED = { api: API };
  window.google = { script: { run: runner(null, null), url: { getLocation: function (cb) {
    var p = {}; location.search.replace(/^\?/, '').split('&').forEach(function (kv) { if (!kv) return; var i = kv.indexOf('='); p[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
    cb({ parameter: p });
  } } } };
})();
</script>
<script>/* ============================================================
   DELIVERY PERFORMANCE ENGINE — AP Circle
   Pure processing: raw report rows in → aggregated results out.
   Runs in the browser (the "macro") and in Node (for testing).
   ============================================================ */
var Engine = (function () {
  'use strict';

  var EB_TYPES = ['SPO','HPO','IDC','NDC','HRO','MMS','PDN','RDN','SDO','SRO','ICH','NPH','NSH','RMO','TMO','PSD','DC','BPC'];
  var BO_TYPES = ['BPO','BNP'];
  var NI_EB_TYPES = ['SPO','HPO','IDC','NDC'];   // not-invoiced check (as current macro)
  var NI_BO_TYPES = ['BPO'];
  var REGIONS = ['Kurnool','Vijayawada','Visakhapatnam'];
  var REGION_ABBR = {Kurnool:'KNL', Vijayawada:'VJA', Visakhapatnam:'VSKP'};

  // ── Default targets (editable in the dashboard) ──────────
  // crit: below this = below target (red); warn: below this = watch (amber)
  var DEFAULT_TARGETS = {
    DPR:   {eb:{crit:90, warn:95}, bo:{crit:75, warn:90}},
    DTA:   {eb:{crit:90, warn:95}, bo:{crit:75, warn:90}},
    DSS:   {eb:{crit:90, warn:95}, bo:{crit:75, warn:90}},
    FMTD:  {eb:{crit:90, warn:95}, bo:{crit:75, warn:90}},
    FMNTD: {eb:{crit:90, warn:95}, bo:{crit:75, warn:90}},
    NOSCAN:{eb:{warn:5,  crit:20}, bo:{warn:5,  crit:20}},  // lower is better
    UNA:   {eb:{warn:10, crit:50}, bo:{warn:10, crit:50}},  // pending per office, lower is better
    // Returns & redirects: higher is worse. warn = watch above, crit = flag above,
    // min = smallest volume (invoiced / received) for an office to be flagged.
    RTS:    {eb:{warn:15, crit:20, min:20},  bo:{warn:15, crit:25, min:5}},   // DPR returned ÷ invoiced
    REDIR:  {eb:{warn:3,  crit:5,  min:20},  bo:{warn:5,  crit:10, min:5}},   // DPR redirected ÷ invoiced
    D0RTS:  {eb:{warn:12, crit:15, min:100}, bo:{warn:8,  crit:12, min:30}},  // DTR D+0 returned ÷ received
    D0REDIR:{eb:{warn:15, crit:25, min:100}, bo:{warn:5,  crit:10, min:30}}   // DTR D+0 redirected ÷ received
  };
  // Older saved targets lack the newer keys: fill them from the defaults
  function fillTargets(t) {
    var out = JSON.parse(JSON.stringify(t || DEFAULT_TARGETS));
    Object.keys(DEFAULT_TARGETS).forEach(function (k) {
      if (!out[k]) out[k] = JSON.parse(JSON.stringify(DEFAULT_TARGETS[k]));
      ['eb','bo'].forEach(function (g) { if (!out[k][g]) out[k][g] = JSON.parse(JSON.stringify(DEFAULT_TARGETS[k][g]));
        Object.keys(DEFAULT_TARGETS[k][g]).forEach(function (f) { if (typeof out[k][g][f] !== 'number' || !isFinite(out[k][g][f])) out[k][g][f] = DEFAULT_TARGETS[k][g][f]; }); });
    });
    return out;
  }

  // Options that change formulas (set from the dashboard)
  var OPTS = { dprRedirect: true };   // Delivery % = (Delivered + Returned + Redirected) / Invoiced
  function setOptions(o) { Object.keys(o || {}).forEach(function (k) { OPTS[k] = o[k]; }); }
  function rederive(res) {
    Object.keys(res.reports).forEach(function (k) {
      var r = res.reports[k], spec = SPEC[k];
      ['eb','bo','unmapped','otherType'].forEach(function (g) { (r[g] || []).forEach(function (o) { spec.derive(o); }); });
    });
    res.summary = summarize(res);
  }

  // ── Small utils ──────────────────────────────────────────
  function num(v) { if (v === null || v === undefined || v === '') return 0; var x = parseFloat(String(v).replace(/,/g,'')); return isFinite(x) ? x : 0; }
  function p2(v) { return Math.round(v * 100) / 100; }
  function pct(a, b) { return b > 0 ? p2(a / b * 100) : 0; }
  function sid(v) { var s = String(v === null || v === undefined ? '' : v).trim(); if (/^\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, ''); return s; }
  function clean(v) { return String(v || '').replace(/\s+/g, ' ').trim(); }
  function cleanRegion(v) { return clean(v).replace(/\s*Region$/i, ''); }
  function cleanDivision(v) { return clean(v).replace(/\s*Division$/i, ''); }
  function regionOrder(r) { var i = REGIONS.indexOf(r); return i < 0 ? 99 : i; }

  function headerIndex(headers, names) {
    var low = headers.map(function (h) { return String(h || '').trim().toLowerCase(); });
    for (var i = 0; i < names.length; i++) { var x = low.indexOf(names[i].toLowerCase()); if (x >= 0) return headers[x]; }
    return null;
  }
  function has(headers, name) { return headerIndex(headers, [name]) !== null; }

  // ── File detection (by header signature, then file name) ──
  var VERSION = '2026-10-08c';
  // DTR article type from the tab name, else from the "Product Category" value in the data
  function dtrPart(name, category) {
    var fn = String(name || '').toUpperCase(), c = String(category || '').toUpperCase();
    if (/PARCEL|\bPCL/.test(fn)) return 'DTAP';
    if (/DOCUMENT|\bDOCS?\b|_DOCS?\b|-DOCS?\b|LETTER/.test(fn)) return 'DTAD';
    if (/PARCEL|\bPCL/.test(c)) return 'DTAP';
    if (/DOC|LETTER|\bLTR/.test(c)) return 'DTAD';
    return 'DTA';
  }
  function detect(fileName, headers, category) {
    var fn = String(fileName || '').toUpperCase();
    if (has(headers, 'office-type-code')) return 'MASTER';
    if (has(headers, 'booking-office-id')) {
      if (/NTD/.test(fn)) return 'FMNTD';
      if (/\bTD\b|_TD|\(TD\)|-TD|TD_|TD\./.test(fn)) return 'FMTD';
      return 'FM?';            // ask the user
    }
    if (has(headers, 'invoice-count')) return 'DPR';
    if (has(headers, 'Same Day Invoiced') || has(headers, 'D0 Delivered')) return dtrPart(fileName, category);

                   off: ['destinations', 'booked', 'same_day', 'not_sd', 'sd_pct', 'hub_rcpt', 'hub_disp', 'hub_pct'], offH: ['Destinations', 'Articles Booked', 'Same Day Dispatched', 'Not Same Day', 'Same Day Dispatch %', 'Source Hub Receipt', 'Source Hub Dispatched', 'Hub Dispatch %'] };

<script>/* ============================================================
   MACRO EXCEL IMPORTER
   Opens the macro's Excel workbook in the dashboard.
   1. Workbooks made by this dashboard carry a hidden sheet with the
      full data (returned as {embedded: base64} for the caller to unzip).
   2. Any other macro export (e.g. the Apps Script DeliveryPerformance_*.xlsx)
      is rebuilt from its office sheets.
   Works with a SheetJS workbook object (browser or Node).
   ============================================================ */
var MacroImporter = (function () {
  'use strict';
  var E = (typeof Engine !== 'undefined') ? Engine : require('./engine.js');
  var X = function () { return (typeof XLSX !== 'undefined') ? XLSX : require('xlsx'); };
  var DATA_SHEET = '_dashboard_data';

  function num(v) { var x = parseFloat(String(v === null || v === undefined ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : 0; }
  function str(v) { var s = String(v === null || v === undefined ? '' : v).trim(); return s === '#N/A' || s === 'None' ? '' : s; }
  function sid(v) { var s = str(v); if (/^\d+(\.0+)?$/.test(s)) s = String(parseInt(s, 10)); return s; }

  // Rows of a report sheet as objects keyed by the header row (found by a key column)
  function table(ws, key) {
    var a = X().utils.sheet_to_json(ws, { header: 1, defval: '', raw: true, blankrows: false });
    var h = -1;
    for (var i = 0; i < Math.min(a.length, 8); i++) if (a[i].map(str).indexOf(key) >= 0) { h = i; break; }
    if (h < 0) return { title: '', rows: [] };
    var head = a[h].map(str), out = [];
    for (var r = h + 1; r < a.length; r++) {
      var o = {}; head.forEach(function (k, j) { if (k) o[k] = a[r][j]; });
      out.push(o);
    }
    return { title: str(a[0] && a[0][0]), rows: out };
  }
  function officeRows(ws) {
    return table(ws, 'Office ID').rows.filter(function (o) { var id = sid(o['Office ID']); return id && /^\d+$/.test(id); });
  }

  function embedded(wb) {
    var ws = wb.Sheets[DATA_SHEET]; if (!ws) return null;
    var a = X().utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
    if (!a.length || str(a[0][0]) !== 'ap-delivery-dashboard') return null;
    var b64 = a.slice(1).map(function (r) { return String(r[0] || ''); }).join('');
    var want = num(a[0][2]);
    if (want && b64.length !== want) throw new Error('The data inside this Excel file is incomplete (it may have been cut short when copied). Download it again from the macro.');
    return b64;
  }

  function dateFrom(wb, fileName) {
    var d = E.dateFromName(fileName);
    if (d) return d;
    for (var i = 0; i < wb.SheetNames.length; i++) {
      var first = X().utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], { header: 1, range: 0, defval: '' })[0] || [];
      var m = String(first[0] || '').match(/(\d{2})\.(\d{2})\.(\d{4})/); if (m) return m[0];
    }
    var t = new Date();
    return ('0' + t.getDate()).slice(-2) + '.' + ('0' + (t.getMonth() + 1)).slice(-2) + '.' + t.getFullYear();
  }

  // Rebuild the dashboard result from the office sheets of a macro export
  function rebuild(wb, fileName, snapshot) {
    var S = (snapshot && snapshot.byId) || {};
    var sheets = wb.SheetNames;
    var res = { reports: {}, files: {}, targets: JSON.parse(JSON.stringify(E.DEFAULT_TARGETS)), log: [],
      masterSource: 'Rebuilt from ' + fileName, masterLoaded: true, generatedAt: new Date().toISOString(),
      opts: { dprRedirect: E.OPTS.dprRedirect }, imported: { from: fileName, partial: {} } };
    function base(o, grp) {
      var id = sid(o['Office ID']), s = S[id] || {};
      return { id: id, name: str(o['Office Name']) || s.name || '', type: str(o['Type']) || s.type || (grp === 'bo' ? 'BPO' : 'SPO'),
        region: str(o['Region']) || s.region || '', division: str(o['Division']) || s.division || '',
        sub: str(o['Sub Division']) || s.sub || '', so: str(o['SO Name']) || s.so || '' };
    }
    function collect(kind, prefix, build) {
      var rep = { eb: [], bo: [], unmapped: [], otherType: [], rows: 0 }, used = [];
      ['EB', 'BO'].forEach(function (G) {
        var name = prefix + '-' + G + '-Office'; if (sheets.indexOf(name) < 0) return;
        var g = G.toLowerCase(), rows = officeRows(wb.Sheets[name]);
        rows.forEach(function (r) { var o = build(base(r, g), r, g); if (o) rep[g].push(o); });
        rep.rows += rows.length; used.push(name);
      });
      if (!used.length) return null;
      res.reports[kind] = rep; res.files[kind] = { name: fileName + ' — ' + used.join(', '), rows: rep.rows };
      return rep;
    }
    collect('DPR', 'DPR', function (o, r) {
      o.postman = 0; o.beat_div = 0;
      o.invoiced = num(r['No.of Articles Invoiced']); o.delivered = num(r['No.of Articles Delivered']); o.returned = num(r['No.of Articles Returned']);
      o.redirected = num(r['No.of Articles Redirected']); o.deposit = num(r['No.of Articles Kept in Deposit']);
      E.SPEC.DPR.derive(o); return o;
    });
    if (collect('DTA', 'DTA', function (o, r) {
      o.received = num(r['Received']); if (o.received <= 0) return null;
      o.same_day_inv = num(r['Same Day Inv']);
      var tot = num(r['D+0 Total']); o.d0_ret = num(r['RTS Value']); o.d0_del = Math.max(0, tot - o.d0_ret); o.d0_red = 0;
      o.d1_del = o.d2_del = o.d3_del = o.d4_del = o.d5_del = o.d6_del = o.d7_del = o.d7p_del = 0;
      E.SPEC.DTA.derive(o); return o;
    })) res.imported.partial.DTA = true;   // the export has no day-by-day split
    collect('UNA', 'UNA', function (o, r) {
      o.day1 = num(r['Day 1']); o.day2 = num(r['Day 2']); o.day3 = num(r['Day 3']); o.day4 = num(r['Day 4']);
      o.day5 = num(r['Day 5']); o.day6 = num(r['Day 6']); o.day7plus = num(r['Day 7+']);
      o.total = o.day1 + o.day2 + o.day3 + o.day4 + o.day5 + o.day6 + o.day7plus; o.offices = 1; o.per_office = o.total;
      return o;
    });
    var dss = collect('DSS', 'DMA', function (o, r) {
      o.pdm = num(r['PDM Articles']); o.dss = num(r['DSS Articles']); E.SPEC.DSS.derive(o);
      if (o.pdm <= 0) { o._skip = true; } return o;
    });
    if (dss) {
      dss.noActivity = { eb: dss.eb.filter(function (o) { return o._skip; }).length, bo: dss.bo.filter(function (o) { return o._skip; }).length };
      dss.eb = dss.eb.filter(function (o) { return !o._skip; }); dss.bo = dss.bo.filter(function (o) { return !o._skip; });
    }
    ['FMTD', 'FMNTD'].forEach(function (k) {
      var fmBuild = function (o, r) {
        o.destinations = num(r['Destinations']); o.booked = num(r['Articles Booked']); o.same_day = num(r['Same Day Dispatched']);
        o.hub_rcpt = num(r['Source Hub Receipt']); o.hub_disp = num(r['Source Hub Dispatched']); E.SPEC[k].derive(o); return o;
      };
      var rep = collect(k, k, fmBuild);
      var un = k + '-Unplaced-Offices';
      if (rep && sheets.indexOf(un) >= 0) officeRows(wb.Sheets[un]).forEach(function (r) {
        var o = { id: sid(r['Office ID']), name: str(r['Office Name']), type: str(r['Type (from name)']), region: '', division: '', sub: '', so: '' };
        rep.unmapped.push(fmBuild(o, r));
      });
    });
    var ni = { eb: [], bo: [], source: 'the Excel file' }, haveNI = false;
    ['EB', 'BO'].forEach(function (G) {
      var name = 'NotInvoiced-' + G + '-Office'; if (sheets.indexOf(name) < 0) return; haveNI = true;
      officeRows(wb.Sheets[name]).forEach(function (r) { ni[G.toLowerCase()].push(base(r, G.toLowerCase())); });
    });
    if (haveNI) res.notInvoiced = ni;
    if (!Object.keys(res.reports).length) throw new Error('No report sheets found. Open the Excel file made by the macro (DeliveryPerformance_DD_MM_YYYY.xlsx).');
    res.reportDate = dateFrom(wb, fileName);
    res.summary = E.summarize(res);

    // Trend history from the DailyHistory sheet, when it has rows
    var history = {};
    if (sheets.indexOf('DailyHistory') >= 0) {
      table(wb.Sheets['DailyHistory'], 'Date').rows.forEach(function (r) {
        var d = str(r['Date']); if (!/^\d{2}\.\d{2}\.\d{4}$/.test(d)) return;
        var pc = function (k) { var v = r[k]; return v === '' || v === undefined ? undefined : num(v); };
        var h = { date: d };
        var put = function (key, obj) { var keep = {}; Object.keys(obj).forEach(function (k) { if (obj[k] !== undefined) keep[k] = obj[k]; }); if (Object.keys(keep).length) h[key] = keep; };
        put('eb_dpr', { pct: pc('EB Del%'), invoiced: pc('EB Invoiced'), delivered: pc('EB Delivered'), returned: pc('EB Returned') });
        put('bo_dpr', { pct: pc('BO Del%'), invoiced: pc('BO Invoiced'), delivered: pc('BO Delivered'), returned: pc('BO Returned') });
        put('eb_una', { total: pc('EB Pending') }); put('bo_una', { total: pc('BO Pending') });
        put('eb_dta', { pct: pc('EB D+0%') }); put('bo_dta', { pct: pc('BO D+0%') });
        put('eb_dss', { pct: pc('EB Mobile%') }); put('bo_dss', { pct: pc('BO Mobile%') });
        put('eb_fmtd', { pct: pc('FM TD %') }); put('eb_fmntd', { pct: pc('FM NTD %') });
        history[d] = h;
      });
    }
    history[res.reportDate] = res.summary;
    return { format: 'ap-delivery-dashboard', version: 1, publishedAt: res.generatedAt, reportDate: res.reportDate, result: res, history: history };
  }

  // → {embedded: base64} or {payload}
  function read(wb, fileName, snapshot) {
    var b = embedded(wb);
    if (b) return { embedded: b };
    return { payload: rebuild(wb, fileName, snapshot) };
  }
  return { read: read, rebuild: rebuild, DATA_SHEET: DATA_SHEET };
})();
if (typeof module !== 'undefined') module.exports = MacroImporter;
</script>

  // Read CSV / XLSX into [{name, rows, headers}]

    }).then(function () {

      var got;
      try { got = window.MacroImporter.read(wb, name, S.snap); } catch (e) { return Promise.reject(e); }

  // Publishing writes the day's data into the site's GitHub repository, so every

  var ADMIN_KEY = 'dpd.admin.v2';

    }).then(function (ct) {

      if (!lsGet(ADMIN_KEY, null)) throw new Error('This browser would not save the settings (private window?).');
    });
  }
  function unlockAdmin(pass) {

    return deriveKey(pass, unb64(st.salt)).then(function (key) {

      else if (r.status === 403) m = 'The access token is not allowed to write to ' + cfg.repo + '. Give it "Contents: Read and write" for this repository.';
      else if (r.status === 404) m = 'Repository or branch not found: check "' + cfg.repo + '" and branch "' + cfg.branch + '" (the token also needs access to it).';
      else if (r.status === 409) m = 'GitHub reported a conflict (the file changed at the same moment). Choose Publish again.';

    d += '<div class="section" style="margin-top:6px"><h3>1. Load today\'s reports</h3><p class="sub">Drop DPR, DTR, UND, DSS, FM TD and FM NTD, and MASTERDATA whenever the office list changes.</p>' + rackHtml() + '</div>';
    if (S.res) {
      d += '<div class="section"><h3>2. Your team</h3><p class="sub">' + (gh ? 'Run macro saves the figures on your site; your team gets them when they open or reload the link.' : 'Your team sees only what is saved on the site.') + '</p>' + dataFileHtml() + '</div>';
      d += '<div class="section"><h3>Targets</h3><p class="sub">Used for the colours, the scorecard and the Excel file. After changing them, choose Publish again so your team gets the same targets.</p>' + adminTargetsHtml() + '</div>';
      d += '<div class="section"><h3>Saved days</h3><p class="sub">Headline figures for the trend and the DailyHistory sheet. They are published with the data.</p>' + adminHistoryHtml() + '</div>';
    }
    return d;
  }

  function bindAdmin(el) {
    var sf = el.querySelector('#setupForm');
    if (sf) {
      var manualBox = sf.querySelector('[name=manual]');
      var ghInputs = ['repo', 'branch', 'path', 'token'].map(function (n) { return sf.querySelector('[name=' + n + ']'); });
      var sync = function () { ghInputs.forEach(function (i) { i.disabled = manualBox.checked; }); };
      manualBox.onchange = sync; sync();
      var cancel = sf.querySelector('[data-cancelsetup]'); if (cancel) cancel.onclick = function () { S.adminSetup = false; rerenderAdmin(); };
      setTimeout(function () { var i = sf.querySelector(ghInputs[0].value ? '[name=token]' : '[name=repo]'); if (i && !i.disabled) i.focus(); }, 30);
      sf.onsubmit = function (e) {
        e.preventDefault();
        var f = new FormData(sf), msg = sf.querySelector('#setupMsg'), btn = sf.querySelector('[type=submit]');
        var manual = manualBox.checked;
        var cfg = { manual: manual,
          repo: String(sf.querySelector('[name=repo]').value || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, ''),
          branch: String(sf.querySelector('[name=branch]').value || 'main').trim() || 'main',
          path: String(sf.querySelector('[name=path]').value || DATA_URL).trim().replace(/^\/+/, '') || DATA_URL,
          token: String(sf.querySelector('[name=token]').value || '').trim() };
        if (manual) { cfg.token = ''; }
        var pass = String(f.get('pass') || ''), pass2 = String(f.get('pass2') || '');
        var fail = function (t) { msg.textContent = t; msg.className = 'form-msg err'; btn.disabled = false; };
        if (!manual && !/^[^/\s]+\/[^/\s]+$/.test(cfg.repo)) return fail('Enter the repository as owner/name, for example nuks1981/delivery-dashboard.');
        if (!manual && !cfg.token) return fail('Paste the GitHub access token (or tick "Skip GitHub for now").');
        if (pass.length < 6) return fail('Use a passkey of at least 6 characters.');
        if (pass !== pass2) return fail('The two passkeys are different.');
        btn.disabled = true; msg.className = 'form-msg'; msg.textContent = manual ? 'Saving…' : 'Testing the connection to GitHub…';
        (manual ? Promise.resolve() : ghTest(cfg)).then(function () { return saveAdminCfg(cfg, pass); }).then(function () {
          S.cfg = cfg; S.unlocked = true; S.adminSetup = false; S.siteCheck = null;
          toast(manual ? 'Saved. Admin unlocked.' : 'Connected to ' + cfg.repo + '. Admin unlocked.');
          if (S.res) { renderTop(); renderNav(); } rerenderAdmin();
        }).catch(function (err) { fail(err.message); });
      };
      return;
    }
    var uf = el.querySelector('#unlockForm');
    if (uf) {
      var inp = uf.querySelector('[name=pass]'); setTimeout(function () { inp.focus(); }, 30);
      uf.onsubmit = function (e) {
        e.preventDefault();
        var msg = uf.querySelector('#unlockMsg'), btn = uf.querySelector('[type=submit]'); btn.disabled = true; msg.className = 'form-msg'; msg.textContent = 'Checking…';
        unlockAdmin(inp.value).then(function (cfg) {
          S.cfg = cfg; S.unlocked = true; inp.value = '';
          if (S.res) { renderTop(); renderNav(); } rerenderAdmin();
        }).catch(function (err) { msg.textContent = err.message; msg.className = 'form-msg err'; btn.disabled = false; inp.select(); });
      };
      uf.querySelector('[data-resetadmin]').onclick = function () {
        if (!confirm('Remove the saved setup from this computer? You will need the GitHub token again. Saved days and targets are kept.')) return;
        try { localStorage.removeItem(ADMIN_KEY); } catch (e) {}
        S.cfg = null; S.unlocked = false; rerenderAdmin();
      };
      return;
    }
    bindRack(el);
    var q = function (sel, fn) { el.querySelectorAll(sel).forEach(function (b) { b.onclick = fn.bind(null, b); }); };
    q('[data-lock]', function () { S.unlocked = false; S.cfg = null; S.inputs = {}; if (S.res) { renderTop(); renderNav(); } rerenderAdmin(); toast('Admin locked'); });
    q('[data-editsetup]', function () { S.adminSetup = true; rerenderAdmin(); });
    q('[data-gotoov]', function () { S.view = 'overview'; renderNav(); renderView(); window.scrollTo(0, 0); });
    q('[data-pubnow]', function (b) { b.disabled = true; b.textContent = 'Publishing…';
      publishNow().then(function () { toast('Published. The site updates in about a minute.'); rerenderAdmin(); }, function () { rerenderAdmin(); }); });
    q('[data-sitecheck]', function (b) { b.disabled = true; checkSite().then(function () { rerenderAdmin(); }); });
    q('[data-dfdl]', function (b) { b.disabled = true; b.textContent = 'Building…';
      setTimeout(function () { var r0 = S.region, d0 = S.division; S.region = ''; S.division = '';
        downloadMacroExcel().then(function (f) { S.region = r0; S.division = d0; rerenderAdmin(); toast(f.name + ' downloaded'); }, function (e) { S.region = r0; S.division = d0; rerenderAdmin(); toast(e.message, 6000); }); }, 30); });
    if (S.res) bindTargetsAndHistory(el);
    if (S.res && !S.siteCheck) checkSite().then(function () { if (S.view === 'admin' && S.unlocked) rerenderAdmin(); });
  }

  // ════════════════════════════════════════════════════════
  //  GOOGLE APPS SCRIPT MODE — data and admin live in the Google Sheet
  // ════════════════════════════════════════════════════════
  function gasCall(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, no) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { no(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r, args);
    });
  }
  function gasUrlParams() {
    return new Promise(function (ok) {
      try { google.script.url.getLocation(function (loc) { var p = {}, src = (loc && loc.parameter) || {}; Object.keys(src).forEach(function (k) { p[k] = src[k]; }); ok(p); }); }
      catch (e) { ok({}); }
      setTimeout(function () { ok({}); }, 1500);
    });
  }
  function gasDecode(d) { return decodeBytes(b64ToBytes(d.b64).buffer).then(parseDataFile); }
  function gasLoad() {
    return gasCall('getDashboardData').then(function (d) {
      if (d.appUrl) S.appUrl = d.appUrl;
      if (d.empty) return null;
      return gasDecode(d).then(function (p) { applyPublished(p, { name: 'Google Sheet' }); return p; });
    });
  }
  function gasReload(msg) {
    return gasLoad().then(function (p) {
      if (!p) return;
      S.siteCheck = null;
      if ($('#app').classList.contains('hidden')) { S.view = 'admin'; showApp(); } else { renderTop(); renderNav(); rerenderAdmin(); }
      if (msg) toast(msg, 5000);
    });
  }

  function viewAdminGas() {
    var head = function (sub, extra) { return '<div class="view-head"><div><h2>Admin</h2><p>' + sub + '</p></div>' + (extra || '') + '</div>'; };
    if (!S.unlocked) {
      return head('Enter the admin passkey to run the macro and change targets.') +
        '<form class="panel panel-pad" id="unlockForm" style="max-width:420px"><div class="form">' +
          '<label>Passkey<input type="password" name="pass" required autocomplete="current-password"></label>' +
          '<div id="unlockMsg" class="form-msg" role="alert"></div>' +
          '<div><button class="btn btn-run" type="submit">Unlock</button></div></div></form>' +
        '<p class="sub" style="margin-top:12px">The passkey is set in the Google Sheet: <b>📊 Delivery Dashboard → Set admin passkey</b>. Your team doesn\'t need this tab.</p>';
    }
    var st = S.gasStatus || { tabs: [] }, run = S.gasRun;
    var d = head('Paste the day\'s reports into the Google Sheet, then run the macro here or from the sheet\'s menu. Everyone with the dashboard link sees the result.',
      '<div style="display:flex;gap:8px">' + (st.sheetUrl ? '<a class="btn" href="' + esc(st.sheetUrl) + '" target="_blank" rel="noopener">Open the Google Sheet</a>' : '') + '<button class="btn" data-lock>Lock</button></div>');
    var rows = st.tabs.map(function (t) {
      var ok = !!t.name;
      return '<tr><td>' + esc(t.label) + '</td><td>' + (ok ? esc(t.name) : '<span class="muted">' + (t.kind === 'MASTER' ? 'Not found; the built-in office list is used' : 'Not found') + '</span>') + '</td><td class="num">' + (ok ? fmt(t.rows) : '–') + '</td><td>' + (ok ? chip('good', 'Found') : chip(t.kind === 'DPR' ? 'crit' : 'warn', t.kind === 'DPR' ? 'Required' : 'Missing')) + '</td></tr>';
    }).join('');
    d += '<div class="section" style="margin-top:6px"><h3>1. Reports in the Google Sheet</h3><p class="sub">Tabs are recognised by their column headers, so tab names don\'t matter. Replace the old rows with the new day\'s report each time.</p>' +
      '<div class="panel"><div class="tbar"><span class="count">' + esc(st.sheetName || '') + '</span><span class="grow"></span><button class="btn btn-sm" data-refresh>Check again</button></div>' +
      '<div class="tscroll" style="max-height:none"><table class="data"><thead><tr><th>Report</th><th>Tab</th><th class="num">Rows</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (st.extra && st.extra.length ? '<div class="pager" style="justify-content:flex-start">Older tabs also found and not used: ' + st.extra.map(esc).join(', ') + '</div>' : '') + '</div></div>';
    var hasDpr = st.tabs.some(function (t) { return t.kind === 'DPR' && t.name; });
    d += '<div class="section"><h3>2. Run the macro</h3><p class="sub">Processes every report tab and publishes the figures to the dashboard straight away.</p>' +
      '<div class="panel panel-pad"><div class="run-actions" style="margin-top:0"><div class="left"><label class="date">Report date <input type="text" id="gdate" value="' + esc(S.gasDate || st.suggestedDate || '') + '" placeholder="dd.mm.yyyy"></label></div>' +
      '<button class="btn btn-run" data-gasrun' + (hasDpr ? '' : ' disabled') + '>Run macro</button></div>' +
      '<div id="gasprog">' + (run ? '<div class="progress" role="status"><ol>' + run.lines.map(function (l) { return '<li class="' + (run.err ? 'err' : 'done') + '">' + esc(l) + '</li>'; }).join('') + '</ol></div>' : '') + '</div>' +
      (S.res ? '<dl class="kv" style="margin-top:12px"><dt>Dashboard shows</dt><dd>Report date <b>' + esc(S.res.reportDate) + '</b>, processed ' + esc(fmtWhen(S.res.generatedAt)) + '</dd>' +
        (S.appUrl ? '<dt>Dashboard link</dt><dd>' + esc(S.appUrl) + '</dd>' : '') + '</dl>' : '') + '</div></div>';
    if (S.res) {
      d += '<div class="section"><h3>Macro Excel</h3><p class="sub">The full report workbook: the same sheets as the old export, plus FM TD and FM NTD.</p><div class="panel panel-pad" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
        '<button class="btn btn-sm" data-gasdrive>Save to Google Drive</button><button class="btn btn-sm" data-dfdl>Download</button>' +
        (S.gasDrive ? '<span class="muted" style="font-size:13px">Saved: <a href="' + esc(S.gasDrive.url) + '" target="_blank" rel="noopener">' + esc(S.gasDrive.name) + '</a> in ' + esc(S.gasDrive.folder) + '</span>' : '') + '</div></div>';
      d += '<div class="section"><h3>Targets</h3><p class="sub">Used for the colours, the scorecard and the Excel file. Applying them re-runs the macro so everyone sees the same targets.</p>' + adminTargetsHtml() + '</div>';
      d += '<div class="section"><h3>Saved days</h3><p class="sub">Headline figures for the trend, kept in the Google Sheet.</p>' + adminHistoryHtml() + '</div>';
    }
    return d;
  }
  function gasRunWith(label, promise, btn) {
    if (btn) { btn.disabled = true; btn.textContent = label; }
    var p = $('#gasprog'); if (p) p.innerHTML = '<div class="progress" role="status">' + esc(label) + '</div>';
    return promise.then(function (out) {
      S.gasRun = { lines: out.lines || [] }; S.gasDate = out.reportDate;
      return gasCall('adminStatus', S.gasPass).then(function (st) { S.gasStatus = st; }).then(function () { return gasReload('Done. The dashboard now shows report date ' + out.reportDate + '.'); });
    }, function (e) { S.gasRun = { lines: [e.message], err: true }; rerenderAdmin(); toast(e.message, 6000); });
  }
  function bindAdminGas(el) {
    var uf = el.querySelector('#unlockForm');
    if (uf) {
      var inp = uf.querySelector('[name=pass]'); setTimeout(function () { inp.focus(); }, 30);
      uf.onsubmit = function (e) {
        e.preventDefault();
        var msg = uf.querySelector('#unlockMsg'), btn = uf.querySelector('[type=submit]'); btn.disabled = true; msg.className = 'form-msg'; msg.textContent = 'Checking…';
        gasCall('adminStatus', inp.value).then(function (st) {
          S.unlocked = true; S.gasPass = inp.value; S.gasStatus = st; inp.value = '';
          if (S.res) { renderTop(); renderNav(); } rerenderAdmin();
        }).catch(function (err) { msg.textContent = err.message; msg.className = 'form-msg err'; btn.disabled = false; inp.select(); });
      };
      return;
    }
    var q = function (sel, fn) { el.querySelectorAll(sel).forEach(function (b) { b.onclick = fn.bind(null, b); }); };
    var date = function () { var i = el.querySelector('#gdate'); return i ? i.value.trim() : ''; };
    var gd = el.querySelector('#gdate'); if (gd) gd.oninput = function () { S.gasDate = gd.value.trim(); };
    q('[data-lock]', function () { S.unlocked = false; S.gasPass = null; S.gasStatus = null; S.gasRun = null; if (S.res) { renderTop(); renderNav(); } rerenderAdmin(); toast('Admin locked'); });
    q('[data-refresh]', function (b) { b.disabled = true; gasCall('adminStatus', S.gasPass).then(function (st) { S.gasStatus = st; rerenderAdmin(); }, function (e) { toast(e.message, 6000); rerenderAdmin(); }); });
    q('[data-gasrun]', function (b) { gasRunWith('Running the macro…', gasCall('adminRunMacro', S.gasPass, date()), b); });
    q('[data-gasdrive]', function (b) {
      b.disabled = true; b.textContent = 'Building…';
      var r0 = S.region, d0 = S.division; S.region = ''; S.division = '';
      payloadB64().then(function (pb) { return window.ExcelExport.build(S.res, S.history, { embed: pb }); }).then(function (buf) {
        S.region = r0; S.division = d0; b.textContent = 'Saving…';
        return gasCall('adminSaveExcel', S.gasPass, b64(buf), excelName(''));
      }).then(function (f) { S.gasDrive = f; rerenderAdmin(); toast('Saved to Google Drive: ' + f.name); }, function (e) { S.region = r0; S.division = d0; toast(e.message, 6000); rerenderAdmin(); });
    });
    q('[data-dfdl]', function (b) { b.disabled = true; b.textContent = 'Building…';
      setTimeout(function () { var r0 = S.region, d0 = S.division; S.region = ''; S.division = '';
        downloadMacroExcel().then(function () { S.region = r0; S.division = d0; rerenderAdmin(); }, function (e) { S.region = r0; S.division = d0; rerenderAdmin(); toast(e.message, 6000); }); }, 30); });
    var ap = el.querySelector('#tApply');
    if (ap) {
      var readT = function () {
        var T = E.fillTargets(S.res.targets);
        el.querySelectorAll('[data-t]').forEach(function (i) { var p = i.getAttribute('data-t').split('.'); var v = parseFloat(i.value); if (isFinite(v)) T[p[0]][p[1]][p[2]] = v; });
        return T;
      };
      ap.onclick = function () { gasRunWith('Applying targets and re-running the macro…', gasCall('adminSaveTargets', S.gasPass, readT(), { dprRedirect: el.querySelector('#optRedir').checked }, S.res.reportDate), ap); };
      el.querySelector('#tReset').onclick = function (e) { gasRunWith('Restoring default targets…', gasCall('adminSaveTargets', S.gasPass, JSON.parse(JSON.stringify(E.DEFAULT_TARGETS)), { dprRedirect: true }, S.res.reportDate), e.target); };
    }
    el.querySelectorAll('[data-delh]').forEach(function (b) { b.onclick = function () {
      var dt = b.getAttribute('data-delh'); if (!confirm('Remove ' + dt + ' from the saved days?')) return;
      gasRunWith('Removing ' + dt + '…', gasCall('adminRemoveDay', S.gasPass, dt, S.res.reportDate), b);
    }; });
  }
  function viewAdminAny() { return GAS ? viewAdminGas() : viewAdmin(); }
  function bindAdminAny(el) { return GAS ? bindAdminGas(el) : bindAdmin(el); }

  function renderAdminStandalone() {
    $('#app').classList.add('hidden');
    var el = $('#run'); el.classList.remove('hidden');
    el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><span class="org">India Post, Andhra Pradesh Circle</span>' +
      '<button class="btn btn-quiet" data-back>Back</button></div>' + viewAdminAny();
    el.querySelector('[data-back]').onclick = function () { S.view = 'overview'; if (S.res) showApp(); else renderWelcome(); };
    bindAdminAny(el);
  }

  // First screen when there is no data yet
  function renderWelcome() {
    $('#app').classList.add('hidden');
    var el = $('#run'); el.classList.remove('hidden');
    if (GAS) {
      el.innerHTML = '<div class="run-head"><div><div class="org">India Post, Andhra Pradesh Circle</div><h1>No figures yet</h1>' +
        '<p>The dashboard fills in as soon as the admin runs the macro in the Google Sheet. Reload the page in a little while.</p></div>' +
        '<button class="btn" data-reload>Reload</button></div>';
      el.querySelector('[data-reload]').onclick = function () { location.reload(); };
      return;
    }
    var hosted = location.protocol !== 'file:';
    el.innerHTML = '<div class="run-head"><div><div class="org">India Post, Andhra Pradesh Circle</div><h1>' + (hosted ? 'Today\'s report is not published yet' : 'Delivery performance') + '</h1>' +
      '<p>' + (hosted ? 'The figures appear here as soon as the admin publishes the day\'s reports. Reload the page in a little while.'
                      : 'Open the macro Excel file (DeliveryPerformance_DD_MM_YYYY.xlsx) to see every report, with Excel and CSV downloads.') + '</p></div>' +
      (hosted ? '<button class="btn" data-reload>Reload</button>' : '') + '</div>' +
      '<div class="welcome-drop' + (hosted ? ' small' : '') + '" tabindex="0" role="button" data-pickdata><b>' + (hosted ? 'Received the Excel file?' : 'Open Excel file') + '</b><span>' + (hosted ? 'Open it here, or drag it onto this box' : 'or drag the macro Excel file here') + '</span></div>' +
      '<p class="admin-link"><button class="btn btn-quiet btn-sm" data-openadmin>Admin sign-in</button></p>';
    el.querySelector('[data-openadmin]').onclick = function () { S.view = 'admin'; renderAdminStandalone(); };
    var rl = el.querySelector('[data-reload]'); if (rl) rl.onclick = function () { location.reload(); };
    var dz = el.querySelector('[data-pickdata]');
    dz.onclick = pickDataFile; dz.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickDataFile(); } };
  }
  function renderMessage(title, body) {
    $('#app').classList.add('hidden');
    var el = $('#run'); el.classList.remove('hidden');
    el.innerHTML = '<div class="run-head"><div><div class="org">India Post, Andhra Pradesh Circle</div><h1>' + title + '</h1><p>' + body + '</p></div></div>';
  }

  function boot() {
    document.documentElement.setAttribute('data-theme', 'light');
    setupTip(); setupDataDrop(); setupDrill();
    S.targets = lsGet('dpd.targets', null);
    S.autoExcel = lsGet('dpd.autoExcel', true);
    var snapP = decodeSnapshot().then(function (snap) { S.snap = snap; });
    renderMessage('Delivery performance', 'Loading…');
    if (GAS) {
      Promise.all([gasLoad(), gasUrlParams()]).then(function (a) {
        if (!a[0]) return renderWelcome();
        applyUrlScope(a[1]); showApp();
      }).catch(function (e) { renderMessage('The figures could not be loaded', esc(e.message || e) + '. Reload the page; if it keeps happening, the admin should run the macro again.'); });
      return snapP;
    }
    var show = function () { applyUrlScope(); showApp(); };
    var gen = function (r) { return (r && r.generatedAt) || ''; };
    // Show the newest of: a file placed on the hosted site, the last file opened here, the admin's last run here
    Promise.all([loadPublished().catch(function () { return null; }), idbGet('loadedData'), idbGet('lastResult')]).then(function (a) {
      var site = a[0], opened = a[1] && a[1].payload ? a[1] : null, last = a[2] && a[2].reports ? a[2] : null;
      var best = null;
      if (site) best = { kind: 'site', g: gen(site.result) };
      if (opened && gen(opened.payload.result) > (best ? best.g : '')) best = { kind: 'opened', g: gen(opened.payload.result) };
      if (last && gen(last) > (best ? best.g : '')) best = { kind: 'last', g: gen(last) };
      if (!best) return renderWelcome();
      if (best.kind === 'site') applyPublished(site, {});
      else if (best.kind === 'opened') applyPublished(opened.payload, { name: opened.name, offline: true });
      else { S.res = last; S.history = lsGet('dpd.history', {}) || {}; S.fromCache = true; if (last.opts) E.setOptions(last.opts); }
      show();
    }).catch(function () { renderWelcome(); });
    return snapP;
  }
  window.DashboardApp = { state: S, boot: boot, runMacro: runMacro, addFiles: addFiles, showApp: showApp };
  document.addEventListener('DOMContentLoaded', boot);
})();
