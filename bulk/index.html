<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP Circle — Bulk Articles Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ---------------------------------------------------------------
   Tokens. Column-group tints follow the Excel reports
   (outcome blue, pending pink, TAT green, standard purple, aging amber).
---------------------------------------------------------------- */
:root{
  --navy:#17325c; --navy2:#22457a; --ink:#1b2735; --ink2:#41546b; --ink3:#6c7d91;
  --paper:#f2f4f7; --card:#ffffff; --line:#d8dee7; --line2:#e8ecf1;
  --red:#b3132b; --red-bg:#fbe7ea; --green:#1d7a46; --green-bg:#e3f3e9;
  --amber:#9a5b00; --amber-bg:#fdf1dc; --blue:#1f5fae;
  --g-out:#e7eef8; --g-out-h:#d0dff2;
  --g-pend:#f8e9ee; --g-pend-h:#f0d3dd;
  --g-tat:#e8f4ea; --g-tat-h:#d0e8d4;
  --g-std:#f1eaf6; --g-std-h:#e2d4ec;
  --g-age:#fdf3e1; --g-age-h:#f9e1b8;
  --g-lead:#f4f6f9; --g-lead-h:#e3e8ef;
  --grid:#b4c0cf; --grid2:#7d8ca1;
  --sans:'IBM Plex Sans',system-ui,'Segoe UI',Arial,sans-serif;
  --cond:'IBM Plex Sans Condensed','Arial Narrow','Segoe UI',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- header ---------- */
.hdr{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;
  padding-top:env(safe-area-inset-top,0px)}
.hdr::after{content:"";display:block;height:4px;
  background:linear-gradient(90deg,#ff9933 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
.hdr-in{max-width:1680px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.hdr .sub{color:#b9cbe4;font-size:13px;margin-top:2px;max-width:min(1100px,70vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.hdr .sub{max-width:100%;white-space:normal}}
.hdr .grow{flex:1}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:7px;
  padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn[disabled]{opacity:.5;cursor:wait}

/* ---------- filters ---------- */
.fbar{background:var(--card);border-bottom:1px solid var(--line)}
.fbar-in{max-width:1680px;margin:0 auto;padding:10px 24px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;color:var(--ink3);font-weight:500}
.fld select,.fld input{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 8px;min-width:120px;max-width:260px}
.fld input[type=date]{min-width:140px}
.fld input.cust{min-width:220px}
.lnk{background:none;border:0;color:var(--blue);cursor:pointer;font-weight:600;padding:8px 4px;height:34px}
.fsum{font-size:13px;color:var(--ink2);margin-left:auto;align-self:center}
.fsum b{color:var(--ink)}

/* ---------- tabs ---------- */
.tabs{max-width:1680px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 9px;cursor:pointer;
  font-weight:600;color:var(--ink2);white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
main{max-width:1680px;margin:0 auto;padding:20px 24px 48px}
.panel[hidden]{display:none}

/* ---------- blocks ---------- */
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h p{color:var(--ink3);font-size:13px}
.sec-h .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--ink3)}
.btn.red{color:var(--red);border-color:#e7b5bd}
.search{height:32px;border:1px solid var(--line);border-radius:7px;padding:0 10px;min-width:200px}
.sel{height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:#fff}

/* KPI row: one wide figure line, not cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--card);
  border:1px solid var(--line);border-radius:10px;margin-bottom:22px}
.kpi{padding:14px 18px;border-right:1px solid var(--line2);cursor:default}
.kpi:last-child{border-right:0}
.kpi[data-list]{cursor:pointer}
.kpi[data-list]:hover{background:#f7f9fc}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:13px;color:var(--ink2);margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
.kpi.good .v{color:var(--green)} .kpi.bad .v{color:var(--red)} .kpi.warn .v{color:var(--amber)}

.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.split .tw{max-height:none}
.lg td .sb{display:inline-block;height:9px;background:var(--navy);border-radius:2px;vertical-align:middle}
.lg td.bar{text-align:left;min-width:120px}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.chart h3{font-size:14px;font-weight:600;margin-bottom:8px}
.chart .cv{position:relative;height:260px}

/* ---------- ledger tables ---------- */
.tw{overflow:auto;max-height:72vh;background:var(--card);border:1px solid var(--grid2);border-radius:8px}
table.lg{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-family:var(--cond);font-size:13px;font-variant-numeric:tabular-nums}
.lg th,.lg td{padding:5px 9px;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);white-space:nowrap}
.lg tr>*:last-child{border-right:0}
.lg thead tr:last-child th{border-bottom:2px solid var(--grid2)}
.lg thead tr.gr th{border-bottom:1px solid var(--grid2)}
.lg .gs{border-left:2px solid var(--grid2)}
.lg td.lead,.lg th.lead{border-right:2px solid var(--grid2)}
.lg thead th{position:sticky;z-index:2;font-weight:600;text-align:center;color:var(--ink)}
.lg thead tr.gr th{top:0;font-size:12px;color:var(--ink2);font-weight:600}
.lg thead tr.hd th{top:29px;cursor:pointer;vertical-align:bottom;white-space:normal;min-width:62px;line-height:1.2}
.lg thead tr.hd th.lead{text-align:left}
.lg thead tr.hd th[aria-sort]::after{content:"";display:inline-block;margin-left:4px;border:4px solid transparent}
.lg thead tr.hd th[aria-sort=descending]::after{border-top-color:var(--ink2);transform:translateY(2px)}
.lg thead tr.hd th[aria-sort=ascending]::after{border-bottom-color:var(--ink2);transform:translateY(-2px)}
.lg td{text-align:right}
.lg td.lead{text-align:left;font-family:var(--sans);font-size:13px;position:sticky;left:0;z-index:1;background:var(--card);max-width:300px;overflow:hidden;text-overflow:ellipsis}
.lg td.lead2{text-align:left;font-family:var(--sans);font-size:13px;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.lg thead th.lead{position:sticky;left:0;z-index:3}
.lg .h-lead{background:var(--g-lead-h)} .lg .h-out{background:var(--g-out-h)} .lg .h-pend{background:var(--g-pend-h)}
.lg .h-tat{background:var(--g-tat-h)} .lg .h-std{background:var(--g-std-h)} .lg .h-age{background:var(--g-age-h)}
.lg .c-out{background:var(--g-out)} .lg .c-pend{background:var(--g-pend)} .lg .c-tat{background:var(--g-tat)}
.lg .c-std{background:var(--g-std)} .lg .c-age{background:var(--g-age)}
.lg td.k{cursor:pointer}
.lg td.k:hover{outline:2px solid var(--blue);outline-offset:-2px}
.lg td.z{color:#b6c0cc}
.lg td.bad{color:var(--red);font-weight:700}
.lg td.good{color:var(--green);font-weight:600}
.lg tr.sub td{font-weight:700;background-image:linear-gradient(rgba(23,50,92,.06),rgba(23,50,92,.06))}
.lg tr.sub td.lead{background:#e9eef5}
.lg tr.tot td{font-weight:700;border-top:2px solid var(--navy);background-image:linear-gradient(rgba(23,50,92,.1),rgba(23,50,92,.1))}
.lg tr.tot td.lead{background:#dfe6f0}
.lg td.lead .lk{color:var(--blue);cursor:pointer;text-decoration:underline;text-decoration-color:#9fb6d6;text-underline-offset:2px}
.lg tr.l2 td.lead{padding-left:22px}
.more{padding:10px;text-align:center;color:var(--ink3);font-size:13px}

/* heat matrix */
.mx td.cell{min-width:58px;text-align:center;cursor:pointer}
.mx td.cell:hover{outline:2px solid var(--ink);outline-offset:-2px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,25,40,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px}
.ov[hidden]{display:none}
.md{background:#fff;border-radius:12px;width:min(1500px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.md-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.md-h h3{font-size:16px;font-weight:700}
.md-h .n{color:var(--ink3);font-size:13px}
.md-h .grow{flex:1}
.md-b{overflow:auto}
.md .lg td{text-align:left}
.md .lg td.r{text-align:right}

/* ---------- status / loader ---------- */
.load{max-width:620px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
.load h2{font-size:18px;margin-bottom:6px}
.load p{color:var(--ink2)}
.bar{height:6px;background:var(--line2);border-radius:3px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .3s}
.err{color:var(--red);font-weight:600;margin-top:12px;white-space:pre-wrap}
.srcs{margin-top:14px;font-size:13px;color:var(--ink2);display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 12px}
.srcs .ok::before{content:"● ";color:var(--green)} .srcs .no::before{content:"● ";color:#b6c0cc} .srcs .bad::before{content:"● ";color:var(--red)}
.foot{max-width:1680px;margin:0 auto;padding:0 24px 28px;color:var(--ink3);font-size:12px}
.note{font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:16px}
textarea.arts{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--cond);font-size:14px}

@media (max-width:700px){
  .hdr{position:static}
  .hdr-in,.fbar-in,main,.tabs,.foot{padding-left:12px;padding-right:12px}
  .fld select,.fld input,.fld input.cust{min-width:0;width:100%;max-width:none}
  .fld{flex:1 1 45%}
  .fsum{margin-left:0}
  .kpi .v{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div>
      <h1>AP Circle — Bulk Articles Monitoring</h1>
      <div class="sub" id="hdrSub">Loading data…</div>
    </div>
    <div class="grow"></div>
    <button class="hbtn" id="btnReload" title="Load the latest cached data">Refresh</button>
    <button class="hbtn" id="btnRebuild" title="Re-read changed Bulk sheets now (takes 1–5 minutes)">Rebuild from sheets</button>
  </div>
</header>

<div class="fbar" id="fbar" hidden>
  <div class="fbar-in">
    <div class="fld"><label for="fBoff">Booking office</label><select id="fBoff"></select></div>
    <div class="fld"><label for="fFrom">Booked from</label><input type="date" id="fFrom"></div>
    <div class="fld"><label for="fTo">Booked to</label><input type="date" id="fTo"></div>
    <div class="fld"><label for="fCust">Customer (name or ID)</label><input class="cust" id="fCust" list="custList" placeholder="All customers" autocomplete="off"><datalist id="custList"></datalist></div>
    <div class="fld"><label for="fAtype">Article type</label><select id="fAtype"></select></div>
    <div class="fld"><label for="fScope">Destination</label>
      <select id="fScope"><option value="all">All circles</option><option value="ap">Andhra Pradesh</option><option value="out">Outside Andhra Pradesh</option></select></div>
    <button class="lnk" id="fReset">Clear filters</button>
    <div class="fsum" id="fSum"></div>
  </div>
</div>

<nav class="tabs" id="tabs" role="tablist" hidden></nav>

<main>
  <div class="load" id="loader">
    <h2>Loading bulk article data</h2>
    <p id="loadMsg">Contacting the data service…</p>
    <div class="bar"><i id="loadBar"></i></div>
    <div class="srcs" id="loadSrcs"></div>
    <div class="err" id="loadErr"></div>
  </div>

  <section class="panel" id="p-overview" hidden></section>
  <section class="panel" id="p-booking" hidden></section>
  <section class="panel" id="p-region" hidden></section>
  <section class="panel" id="p-dest" hidden></section>
  <section class="panel" id="p-std" hidden></section>
  <section class="panel" id="p-pending" hidden></section>
  <section class="panel" id="p-atype" hidden></section>
  <section class="panel" id="p-cust" hidden></section>
  <section class="panel" id="p-circle" hidden></section>
  <section class="panel" id="p-search" hidden></section>
</main>
<div class="foot" id="foot"></div>

<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="mdTitle">
  <div class="md">
    <div class="md-h">
      <h3 id="mdTitle"></h3><span class="n" id="mdN"></span>
      <div class="grow"></div>
      <input class="search" id="mdSearch" placeholder="Find in this list">
      <button class="btn" id="mdCsv">Download CSV</button>
      <button class="btn" id="mdClose">Close</button>
    </div>
    <div class="md-b" id="mdBody"></div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — paste the Apps Script Web app URL (ends with /exec)
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyfvUbolSO9LbBClmt6PViGZDwFhw31D29OzqsxkLPPH_KgVPb9dpBK1sg_e-JDlZ4P/exec';
const HOME_CIRCLE = 'Andhra Pradesh';

/* =====================================================================
   DATA LOADING
   ===================================================================== */
const DIMS = ['off','div','reg','cir','cust','atype','boff','bdiv','ev','evoff','st','chan'];
const NUMS = ['bday','dday','evmin','tat','std','dpin'];
let D = null;          // merged data store
let IDX = new Int32Array(0);   // rows passing the filters
const ui = {};         // per-tab UI state

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return n==null||isNaN(n)?'':Math.round(n).toLocaleString('en-IN')}
function pct(a,b){return b>0?(a/b*100):NaN}
function fpct(v){return isNaN(v)?'':v.toFixed(1)+'%'}
function fshare(v){return isNaN(v)?'':(v>0&&v<1?v.toFixed(2):v.toFixed(1))+'%'}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dstr(day){if(day<0)return'';const d=new Date(day*86400000);return String(d.getUTCDate()).padStart(2,'0')+'-'+MON[d.getUTCMonth()]+'-'+d.getUTCFullYear()}
function diso(day){return new Date(day*86400000).toISOString().slice(0,10)}
function isoDay(s){if(!s)return null;const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/86400000):null}
function evstr(min){if(min<0)return'';const d=new Date((min+330)*60000);return dstr(Math.floor((min+330)/1440))+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')}

async function getJSON(url){
  const r = await fetch(url,{redirect:'follow'});
  const t = await r.text();
  try{return JSON.parse(t)}catch(e){throw new Error('The data service did not return JSON. Check API_URL and that the web app is deployed for "Anyone".')}
}
async function gunzipB64(b64){
  const clean = String(b64).replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(clean); const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window)) throw new Error('This browser cannot unpack the data. Use a current Chrome, Edge, Firefox or Safari.');
  const s = new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(s).text());
}

/* one sheet's data: compressed first, plain JSON as fallback */
function tryJSON(t){try{return JSON.parse(t)}catch(e){return null}}
function snippet(t){return String(t).replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,300)}
async function fetchText(url){const r=await fetch(url,{redirect:'follow'});return {status:r.status,text:await r.text()}}
async function fetchPart(s){
  const base=API_URL+'?action=part&i='+s.i;
  let first='';
  try{
    const r=await fetchText(base); first=r.text;
    const env=tryJSON(r.text);
    if(env&&env.ok===false) throw new Error(s.name+': '+(env.error||'not available'));
    if(env&&env.b64) return await gunzipB64(env.b64);
    if(!env&&/^[A-Za-z0-9+\/=_\-\s]+$/.test(r.text.slice(0,2000))) return await gunzipB64(r.text);   // older Code.gs
  }catch(e){ if(/not available|No cache/.test(e.message)) throw e; console.warn(s.name+': compressed download failed, trying plain JSON',e) }
  const r2=await fetchText(base+'&fmt=json');
  const obj=tryJSON(r2.text);
  if(obj&&obj.cols) return obj;
  if(obj&&obj.ok===false) throw new Error(s.name+': '+(obj.error||'not available'));
  throw new Error(s.name+': the data service sent back a page instead of data (HTTP '+r2.status+'). '+
    'It said: “'+(snippet(r2.text)||snippet(first)||'(empty)')+'”. Check the deployment is a new version of the latest Code.gs, '+
    'with Execute as “Me” and access “Anyone”.');
}

/* small IndexedDB cache so unchanged sheets are not downloaded again */
const idb = {
  db:null,
  async open(){ if(this.db) return this.db;
    this.db = await new Promise((res,rej)=>{const q=indexedDB.open('bulk-monitor',1);
      q.onupgradeneeded=()=>q.result.createObjectStore('parts');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
    return this.db },
  async get(k){try{const db=await this.open();return await new Promise(r=>{const q=db.transaction('parts').objectStore('parts').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}},
  async put(k,v){try{const db=await this.open();db.transaction('parts','readwrite').objectStore('parts').put(v,k)}catch(e){}},
  async prune(keep){try{const db=await this.open();const st=db.transaction('parts','readwrite').objectStore('parts');
      const q=st.getAllKeys();q.onsuccess=()=>q.result.forEach(k=>{if(!keep.includes(k))st.delete(k)})}catch(e){}}
};

async function loadAll(){
  $('loader').hidden=false; $('loadErr').textContent='';
  if(API_URL.indexOf('http')!==0){
    $('loadMsg').textContent='The dashboard is not connected yet.';
    $('loadErr').textContent='Open this HTML file in a text editor and paste your Apps Script Web app URL into API_URL (near the top of the script).';
    return;
  }
  setLoad('Fetching the list of Bulk sheets…',3);
  const man = await getJSON(API_URL+'?action=manifest');
  if(!man.ok) throw new Error(man.error||'Data service error');
  renderSrcs(man.sources,{});
  const srcs = man.sources.filter(s=>s.ready&&s.rows>0);
  if(!srcs.length) throw new Error('No Bulk sheet has been cached yet. Run setup() in the Apps Script project, or press "Rebuild from sheets".');
  const parts=[], state={}; let done=0;
  const keys = srcs.map(s=>s.name+'@'+s.version);
  const queue = srcs.slice();
  async function worker(){
    while(queue.length){
      const s=queue.shift(); const key=s.name+'@'+s.version;
      let obj = await idb.get(key);
      if(!obj){
        obj = await fetchPart(s);
        idb.put(key,obj);
      }
      parts[s.i]=obj; state[s.i]='ok'; done++;
      setLoad('Loaded '+done+' of '+srcs.length+' sheets…',5+90*done/srcs.length);
      renderSrcs(man.sources,state);
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  idb.prune(keys);
  setLoad('Preparing the dashboard…',97);
  await new Promise(r=>setTimeout(r,20));
  D = buildStore(parts.filter(Boolean), man);
  $('loader').hidden=true;
  startUI();
}

/* merge the parts into one columnar store */
function buildStore(parts, man){
  const dict={}, dmap={};
  DIMS.forEach(k=>{dict[k]=[];dmap[k]=new Map()});
  let N=0; parts.forEach(p=>N+=p.rows);
  const C={};
  DIMS.forEach(k=>C[k]=new Int32Array(N));
  NUMS.forEach(k=>C[k]=new Int32Array(N));
  C.art=new Array(N); C.src=new Uint8Array(N);
  let o=0;
  parts.forEach(p=>{
    const re={};
    DIMS.forEach(k=>{re[k]=(p.dicts[k]||[]).map(v=>{let c=dmap[k].get(v);if(c===undefined){c=dict[k].length;dict[k].push(v);dmap[k].set(v,c)}return c})});
    const pc=p.cols;
    for(let r=0;r<p.rows;r++){
      const i=o+r;
      for(const k of DIMS){C[k][i]=re[k][pc[k][r]]}
      for(const k of NUMS){C[k][i]=pc[k]?pc[k][r]:-1}
      C.art[i]=pc.art[r]; C.src[i]=p.i;
    }
    o+=p.rows;
  });

  // Booking offices that arrive as a bare PIN: name them from the destination
  // data (same PIN as a destination office), e.g. "515231" -> "Gorantla S.O (515231)".
  const pinName=new Map();
  for(let i=0;i<N;i++){const pn=C.dpin[i];if(pn>0&&!pinName.has(pn))pinName.set(pn,dict.off[C.off[i]])}
  dict.boff=dict.boff.map(v=>{const t=String(v).trim();if(!/^\d{4,6}$/.test(t))return v;
    const nm=pinName.get(+t);return nm&&nm!=='(Unmapped)'?nm+' ('+t+')':'PIN '+t});

  // Booking dates with day and month swapped (01-10 read as 10-Jan): repair using
  // the last event date (same rule as Code.gs / macro v3.0), for data cached earlier.
  let swapped=0;
  for(let i=0;i<N;i++){const b=C.bday[i],em=C.evmin[i];if(b<0||em<0)continue;const ev=Math.floor((em+330)/1440);
    if(!(b>ev||ev-b>60))continue;const dt=new Date(b*86400000),d=dt.getUTCDate(),m=dt.getUTCMonth()+1;if(d>12||d===m)continue;
    const sw=Math.floor(Date.UTC(dt.getUTCFullYear(),d-1,m)/86400000);if(sw<=ev&&ev-sw<=60){C.bday[i]=sw;swapped++}}

  // duplicate article numbers across sheets: keep the latest event
  const keep=new Uint8Array(N).fill(1); const seen=new Map(); let dup=0;
  for(let i=0;i<N;i++){const a=C.art[i];const j=seen.get(a);
    if(j===undefined){seen.set(a,i)}else{dup++; if(C.evmin[i]>=C.evmin[j]){keep[j]=0;seen.set(a,i)}else keep[i]=0}}

  // status: 0 delivered, 1 delivered to sender, 2 returned to sender, 3 pending
  const stCode=dict.st.map(s=>{const t=s.toLowerCase();
    if(t==='delivered')return 0; if(t.indexOf('delivered to sender')>=0)return 1; if(t.indexOf('returned')>=0)return 2; return 3});
  const S=new Uint8Array(N); let maxEv=-1;
  for(let i=0;i<N;i++){S[i]=stCode[C.st[i]]; if(keep[i]&&C.evmin[i]>maxEv)maxEv=C.evmin[i]}
  const asOf = maxEv>0?Math.floor((maxEv+330)/1440):Math.floor(Date.now()/86400000);

  // holidays (Holidays tab of Bulk1): skipped ONLY when one falls on the last day
  // of the standard TAT (booking + std). Same rule as macro v2.9.
  const HOL=new Set(man.holidays||[]), SUN=!!man.sundayHoliday;
  const isHol=d=>HOL.has(d)||(SUN&&((d+4)%7===0));
  const holAdj=(b,e,std)=>{
    if(std<0||(!HOL.size&&!SUN))return 0;
    const dl=b+std;let k=0;while(k<30&&isHol(dl+k))k++;
    if(!k)return 0;const past=e-dl;return past<=0?0:Math.min(k,past)};
  const daysTo=(b,e,std)=>Math.max(0,e-b)-holAdj(b,e,std);
  // derived: delivery TAT, pending aging, standard TAT result
  //   STD: 1 within, 2 beyond, 3 no standard (delivered) | 4 within so far, 5 overdue, 6 no standard (pending)
  const TAT=new Int32Array(N).fill(-1), AG=new Int32Array(N).fill(-1), STD=new Uint8Array(N);
  const HA=new Uint8Array(N), RAW=new Int32Array(N).fill(-1);   // holiday days removed, calendar days
  for(let i=0;i<N;i++){
    const s=S[i], std=C.std[i];
    if(s===0){
      // TAT is worked out here from the dates (not taken from the sheet), so the
      // holiday rule applies even to data processed with an older macro.
      let t=C.tat[i];
      if(C.dday[i]>=0&&C.bday[i]>=0){const raw=Math.max(0,C.dday[i]-C.bday[i]);const a=holAdj(C.bday[i],C.dday[i],std);RAW[i]=raw;HA[i]=a;t=raw-a}
      TAT[i]=t;
      STD[i]= (std>=0&&t>=0)?(t<=std?1:2):3;
    }else if(s===3){
      if(C.bday[i]>=0){const raw=Math.max(0,asOf-C.bday[i]);const a=holAdj(C.bday[i],asOf,std);RAW[i]=raw;HA[i]=a;AG[i]=raw-a}
      STD[i]= std>=0?(AG[i]>std?5:4):6;
    }
  }
  const apCode = dict.cir.indexOf(HOME_CIRCLE);
  const custByBoff=new Map();
  for(let i=0;i<N;i++){if(!keep[i])continue;let st=custByBoff.get(C.boff[i]);if(!st){st=new Set();custByBoff.set(C.boff[i],st)}st.add(C.cust[i])}
  const custLabel = dict.cust.map(s=>{const p=s.split('|');return (p.slice(1).join('|')||'(no name)')+' ('+p[0]+')'});
  let minDay=Infinity,maxDay=-1;
  for(let i=0;i<N;i++){const b=C.bday[i];if(b<0)continue;if(b<minDay)minDay=b;if(b>maxDay)maxDay=b}
  const holDays=[...HOL].sort((a,b)=>a-b), holNames=man.holidayNames||{};
  return {N,C,dict,S,TAT,AG,STD,HA,RAW,swapped,keep,dup,asOf,apCode,custLabel,custByBoff,holCount:HOL.size,holDays,holNames,sunHol:SUN,man,minDay,maxDay};
}

   ===================================================================== */
function newStat(){return{n:0,d:0,s:0,r:0,p:0,ts:0,tn:0,tm:0,tb0:0,tb1:0,tb2:0,tb3:0,w:0,b:0,ns:0,pw:0,po:0,pns:0,ab0:0,ab1:0,ab2:0,ab3:0,old:0,ev:null}}
function band(x){return x<3?0:x<7?1:x<15?2:3}
function addRow(st,i){
  const s=D.S[i]; st.n++;
  if(s===0){st.d++;const t=D.TAT[i];if(t>=0){st.ts+=t;st.tn++;if(t>st.tm)st.tm=t;st['tb'+band(t)]++}}
  else if(s===1)st.s++; else if(s===2)st.r++;
  else{st.p++;const a=D.AG[i];if(a>=0){st['ab'+band(a)]++;if(a>st.old)st.old=a}}
  switch(D.STD[i]){case 1:st.w++;break;case 2:st.b++;break;case 3:st.ns++;break;case 4:st.pw++;break;case 5:st.po++;break;case 6:st.pns++;break}
  if(!st.ev)st.ev=new Int32Array(D.dict.ev.length);
  st.ev[D.C.ev[i]]++;
}
function aggregate(rows,keyFn){const m=new Map();for(const i of rows){const k=keyFn(i);let s=m.get(k);if(!s){s=newStat();m.set(k,s)}addRow(s,i)}return m}
function total(rows){const s=newStat();for(const i of rows)addRow(s,i);return s}

/* metric -> row predicate, for drill-down lists */
function metricPred(m){
  const S=D.S,TAT=D.TAT,AG=D.AG,STD=D.STD,EV=D.C.ev;
  if(m.startsWith('ev'))return i=>EV[i]===+m.slice(2);
  switch(m){
    case'n':return()=>true; case'd':return i=>S[i]===0; case's':return i=>S[i]===1; case'r':return i=>S[i]===2; case'p':return i=>S[i]===3;
    case'tb0':case'tb1':case'tb2':case'tb3':{const b=+m[2];return i=>S[i]===0&&TAT[i]>=0&&band(TAT[i])===b}
    case'ab0':case'ab1':case'ab2':case'ab3':{const b=+m[2];return i=>S[i]===3&&AG[i]>=0&&band(AG[i])===b}
    case'w':return i=>STD[i]===1; case'b':return i=>STD[i]===2; case'ns':return i=>STD[i]===3;
    case'pw':return i=>STD[i]===4; case'po':return i=>STD[i]===5; case'pns':return i=>STD[i]===6;
  }
  return()=>true;
}

/**

 */
function ledger(spec){
  const id=spec.id; const st=ui[id]=ui[id]||{sort:spec.sort||(spec.levels.length>1?'name':'n'),dir:spec.dir||(spec.levels.length>1?1:-1),q:'',all:false};
  let rows=spec.rows; if(spec.filter)rows=rows.filter(spec.filter);
  const groups=columnsFor(spec.cols,rows);
  const L=spec.levels;
  const k1=L[0].f, k2=L[1]?L[1].f:null;
  const m1=aggregate(rows,k1);
  let m2=null; if(k2){m2=aggregate(rows,i=>k1(i)*1e6+k2(i))}
  const tot=total(rows);
  const q=st.q.toLowerCase();
  const sortVal=(code,s,lv)=>st.sort==='name'?L[lv].label(code).toLowerCase():val(s,st.sort);
  const cmp=(a,b)=>{const x=a.v,y=b.v;if(typeof x==='string')return st.dir*x.localeCompare(y);const xx=isNaN(x)?-Infinity:x,yy=isNaN(y)?-Infinity:y;return st.dir*(xx-yy)};

    children.forEach(a=>a.sort(cmp))}

    else top=top.filter(r=>{if(L[0].label(r.c).toLowerCase().includes(q))return true;const ch=children.get(r.c).filter(x=>L[1].label(x.c).toLowerCase().includes(q));if(ch.length){children.set(r.c,ch);return true}return false});
  }
  const limit=spec.limit||400;
  let html='<table class="lg"><thead><tr class="gr">';
  const nLead=(m2?1:1)+(spec.extra?1:0);
  html+='<th class="h-lead lead" colspan="1"></th>'+(spec.extra?'<th class="h-lead"></th>':'');
  groups.forEach((g,gi)=>{html+='<th class="h-'+g.c+(gi?' gs':'')+'" colspan="'+g.cols.length+'">'+esc(g.g)+'</th>'});
  html+='</tr><tr class="hd">';
  const srt=(k)=>st.sort===k?' aria-sort="'+(st.dir>0?'ascending':'descending')+'"':'';
  html+='<th class="h-lead lead" data-s="name"'+srt('name')+'>'+esc(L.map(l=>l.name).join(' / '))+'</th>';
  if(spec.extra)html+='<th class="h-lead">'+esc(spec.extra.name)+'</th>';
  groups.forEach((g,gi)=>g.cols.forEach(([k,lab],ci)=>{html+='<th class="h-'+g.c+(gi&&!ci?' gs':'')+'" data-s="'+k+'"'+srt(k)+'>'+esc(lab)+'</th>'}));
  html+='</tr></thead><tbody>';
  const rowHtml=(s,cls,lead,attrs)=>{
    let h='<tr class="'+cls+'">'+lead;
    groups.forEach((g,gi)=>g.cols.forEach(([k],ci)=>{
      const v=val(s,k); let c='c-'+g.c+(gi&&!ci?' gs':'');
      if(CLICK.has(k)||k.startsWith('ev')){if(v)c+=' k';else c+=' z'}
      if((k==='b'||k==='po')&&v>0)c+=' bad';
      if(k==='wp'&&!isNaN(v))c+=v>=90?' good':v<70?' bad':'';
      h+='<td class="'+c+'" data-m="'+k+'"'+attrs+'>'+cellFmt(k,v)+'</td>'}));
    return h+'</tr>'};
  let shown=0;
  for(const r of top){
    if(!st.all&&shown>=limit)break;
    const lab=L[0].label(r.c);
    const labH=L[0].link?'<span class="lk" data-link="'+r.c+'">'+esc(lab)+'</span>':esc(lab);
    const ex=spec.extra?'<td class="lead2">'+esc(spec.extra.f(r.c))+'</td>':'';
    html+=rowHtml(r.s,m2?'sub':'','<td class="lead" title="'+esc(lab)+'">'+labH+'</td>'+ex,' data-a="'+r.c+'"');
    shown++;
    if(m2){for(const x of children.get(r.c)){
      const l2=L[1].label(x.c);
      const l2H=L[1].link?'<span class="lk" data-link2="'+x.c+'">'+esc(l2)+'</span>':esc(l2);
      html+=rowHtml(x.s,'l2','<td class="lead" title="'+esc(l2)+'">'+l2H+'</td>',' data-a="'+r.c+'" data-b="'+x.c+'"')}}
  }
  html+=rowHtml(tot,'tot','<td class="lead">Grand total</td>'+(spec.extra?'<td></td>':''),'');
  html+='</tbody></table>';
  if(!st.all&&top.length>limit)html+='<div class="more">Showing '+limit+' of '+fmt(top.length)+' rows. <button class="btn" data-all="1">Show all</button></div>';
  if(!rows.length)html='<div class="more">No articles match the current filters.</div>';
  const el=spec.el; el.innerHTML=html;
  el.onclick=(e)=>{
    const th=e.target.closest('th[data-s]');
    if(th){const k=th.dataset.s;if(st.sort===k)st.dir=-st.dir;else{st.sort=k;st.dir=k==='name'?1:-1}ledger(spec);return}
    if(e.target.closest('[data-all]')){st.all=true;ledger(spec);return}
    const ln=e.target.closest('[data-link]');if(ln){L[0].link(+ln.dataset.link);return}
    const ln2=e.target.closest('[data-link2]');if(ln2){L[1].link(+ln2.dataset.link2);return}
    const td=e.target.closest('td.k');if(!td)return;
    const m=td.dataset.m, pred=metricPred(m);
    const a=td.dataset.a!==undefined?+td.dataset.a:null, b=td.dataset.b!==undefined?+td.dataset.b:null;
    const sel=rows.filter(i=>(a===null||k1(i)===a)&&(b===null||k2(i)===b)&&pred(i));
    let title=mname(m); title=title.charAt(0).toUpperCase()+title.slice(1);
    const where=[a!==null?L[0].label(a):null,b!==null?L[1].label(b):null].filter(Boolean).join(' › ');
    openList(title+(where?' — '+where:''),sel);
  };
  if(spec.searchEl){spec.searchEl.value=st.q;spec.searchEl.oninput=()=>{st.q=spec.searchEl.value;st.all=false;clearTimeout(st.t);st.t=setTimeout(()=>ledger(spec),250)}}
}

let LIST={rows:[],title:'',shown:0,view:[]};
function openList(title,rows){

  LIST.rows.sort((a,b)=>D.C.bday[a]-D.C.bday[b]||(D.C.art[a]<D.C.art[b]?-1:1));

function drawList(reset){

  let rh='';

$('mdSearch').addEventListener('input',()=>{const q=$('mdSearch').value.trim().toLowerCase();

function downloadCSV(name,head,rows){
  const q=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const csv='\ufeff'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_').slice(0,80)+'.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- Standard TAT ---------- */
function tStd(){
  const el=$('p-std'); const rows=apRows(); const s=total(rows);
  const measure=ui.mxMeasure=ui.mxMeasure||'wp';
  const k=(v,l,sub,cls,m)=>'<div class="kpi '+(cls||'')+'" data-list="'+m+'" tabindex="0" role="button"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+'</div>';
  el.innerHTML=apNote()+'<div class="note">Standard TAT comes from the Division-to-Division TAT table: booking division × destination division. Delivered on the standard day counts as within. If the last day of the standard is a holiday, the deadline moves to the next working day. Articles to destinations outside Andhra Pradesh have no standard.</div>'+
    '<div class="kpis">'+
      k(fmt(s.d),'Delivered (AP destinations)','','', 'd')+
      k(fmt(s.w),'Within standard',fpct(pct(s.w,s.w+s.b))+' of measurable','good','w')+
      k(fmt(s.b),'Beyond standard','',s.b?'bad':'','b')+
      k(fmt(s.ns),'Delivered, no standard','','','ns')+
      k(fmt(s.pw),'Pending, within so far','','','pw')+
      k(fmt(s.po),'Pending, already overdue','',s.po?'bad':'','po')+
    '</div>'+
    '<div class="sec">'+secHead('Booking division × destination division','Click a cell to list its articles.',
      '<div class="seg" role="group" aria-label="Measure"><button data-x="wp" aria-pressed="'+(measure==='wp')+'">% within</button><button data-x="b" aria-pressed="'+(measure==='b')+'">Beyond standard</button><button data-x="avg" aria-pressed="'+(measure==='avg')+'">Avg TAT</button><button data-x="po" aria-pressed="'+(measure==='po')+'">Pending overdue</button></div>')+
      '<div class="tw" id="mx"></div></div>'+
    '<div class="sec">'+secHead('Holidays on the last day of standard TAT','Articles whose deadline fell on a holiday. Their TAT does not count that day.','<button class="btn" id="hoCsv">Download CSV</button>')+'<div class="tw" id="ho"></div></div>'+
    '<div class="sec">'+secHead('By standard TAT','How articles fare for each standard (1, 2 or 3 days).','<button class="btn" id="sdCsv">Download CSV</button>')+'<div class="tw" id="sd"></div></div>'+
    '<div class="sec">'+secHead('By destination division','','<button class="btn" id="sdvCsv">Download CSV</button>')+'<div class="tw" id="sdv"></div></div>';
  bindKpis(el,rows);
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ui.mxMeasure=b.dataset.x;tStd()});
  // matrix
  const m=aggregate(rows,i=>D.C.bdiv[i]*1e6+D.C.div[i]);
  const bd=[...new Set([...m.keys()].map(x=>Math.floor(x/1e6)))].sort((a,b)=>D.dict.bdiv[a].localeCompare(D.dict.bdiv[b]));
  const dd=[...new Set([...m.keys()].map(x=>x%1e6))].sort((a,b)=>D.dict.div[a].localeCompare(D.dict.div[b]));
  const color=(v)=>{
    if(v==null||isNaN(v))return'';
    if(measure==='wp'){const t=Math.max(0,Math.min(1,(v-50)/50));return'background:'+mix([251,231,234],[227,243,233],t)}
    if(measure==='avg'){const t=Math.max(0,Math.min(1,(v-1)/4));return'background:'+mix([227,243,233],[251,231,234],t)}
    return v>0?'background:'+mix([255,255,255],[245,190,198],Math.min(1,v/50)):'';
  };
  let h='<table class="lg mx"><thead><tr class="hd"><th class="h-lead lead" style="top:0">Booking ↓ / Destination →</th>'+dd.map(c=>'<th class="h-std" style="top:0">'+esc(D.dict.div[c])+'</th>').join('')+'</tr></thead><tbody>';
  bd.forEach(b=>{h+='<tr><td class="lead">'+esc(D.dict.bdiv[b])+'</td>';dd.forEach(d=>{const x=m.get(b*1e6+d);if(!x){h+='<td class="z"></td>';return}
    const v=val(x,measure);const txt=measure==='wp'?fpct(v):measure==='avg'?(isNaN(v)?'':v.toFixed(1)):fmt(v);
    h+='<td class="cell" style="'+color(v)+'" data-b="'+b+'" data-d="'+d+'" title="'+esc(D.dict.bdiv[b]+' → '+D.dict.div[d])+': '+fmt(x.n)+' articles, '+fmt(x.w)+' within, '+fmt(x.b)+' beyond, '+fmt(x.po)+' overdue">'+txt+'</td>'});h+='</tr>'});
  $('mx').innerHTML=h+'</tbody></table>';
  $('mx').onclick=e=>{const td=e.target.closest('td.cell');if(!td)return;const b=+td.dataset.b,d=+td.dataset.d;
    const pm=measure==='po'?'po':measure==='b'?'b':null;const p=pm?metricPred(pm):()=>true;
    openList((pm?mname(pm).replace(/^./,c=>c.toUpperCase()):'Articles')+' — '+D.dict.bdiv[b]+' → '+D.dict.div[d],rows.filter(i=>D.C.bdiv[i]===b&&D.C.div[i]===d&&p(i)))};
  holidayTable($('ho'),rows);
  $('hoCsv').onclick=()=>tableCSV($('ho'),'Holiday adjustments');
  ledger({id:'sd',el:$('sd'),rows,levels:[LV.std],cols:'std',sort:'name',dir:1});
  ledger({id:'sdv',el:$('sdv'),rows,levels:[LV.div],cols:'std',sort:'name',dir:1});
  $('sdCsv').onclick=()=>tableCSV($('sd'),'By standard TAT');
  $('sdvCsv').onclick=()=>tableCSV($('sdv'),'Standard TAT by destination division');
}
function holidayTable(el,rows){
  if(!D.holCount){
    el.innerHTML='<div class="more" style="text-align:left;padding:14px">No holidays reached the dashboard. Add a tab named <b>Holidays</b> to the <b>Bulk1</b> Google Sheet (dates in column A from row 2, occasion in column B), update Code.gs and deploy a new version. The list is picked up within 10 minutes.</div>';
    el.onclick=null;return;
  }
  // group by the holiday on which the deadline fell (booking + standard)
  const by=new Map(); D.holDays.forEach(d=>by.set(d,{dl:[],rescued:[],pend:[],other:[]}));
  for(const i of rows){
    if(!D.HA[i])continue;
    const g=by.get(D.C.bday[i]+D.C.std[i]); if(!g)continue;
    if(D.S[i]===0){g.dl.push(i); if(D.RAW[i]>D.C.std[i]&&D.STD[i]===1)g.rescued.push(i)}
    else if(D.S[i]===3)g.pend.push(i);
  }
  const keys=['dl','rescued','pend'];
  let h='<table class="lg"><thead><tr class="hd"><th class="h-lead lead" style="top:0">Holiday</th><th class="h-lead" style="top:0">Occasion</th>'+
    '<th class="h-std gs" style="top:0">Delivered, holiday not counted</th><th class="h-std" style="top:0">Within standard only because of the holiday</th><th class="h-age gs" style="top:0">Pending, holiday not counted</th></tr></thead><tbody>';
  const tot={dl:0,rescued:0,pend:0};
  D.holDays.forEach(d=>{const g=by.get(d);keys.forEach(k=>tot[k]+=g[k].length);
    h+='<tr><td class="lead">'+dstr(d)+'</td><td class="lead2">'+esc(D.holNames[d]||'')+'</td>'+
      keys.map((k,n)=>'<td class="'+(n===2?'c-age gs':'c-std'+(n?'':' gs'))+(g[k].length?' k':' z')+'" data-d="'+d+'" data-k="'+k+'">'+fmt(g[k].length)+'</td>').join('')+'</tr>'});
  h+='<tr class="tot"><td class="lead">Total</td><td></td>'+keys.map((k,n)=>'<td class="'+(n===2?'gs':(n?'':'gs'))+'">'+fmt(tot[k])+'</td>').join('')+'</tr></tbody></table>';
  el.innerHTML=h;
  const T={dl:'Delivered, holiday not counted',rescued:'Within standard because of the holiday',pend:'Pending, holiday not counted'};
  el.onclick=e=>{const td=e.target.closest('td.k[data-d]');if(!td)return;const g=by.get(+td.dataset.d);
    openList(T[td.dataset.k]+' — '+dstr(+td.dataset.d),g[td.dataset.k])};
}

  el.innerHTML='<div class="sec">'+secHead('Find articles','Paste one or more article numbers, separated by spaces, commas or new lines. Searches all data, ignoring the filters.')+
    '<textarea class="arts" id="srQ" placeholder="EN516811274IN&#10;EN793909299IN"></textarea>'+
    '<div style="margin-top:10px;display:flex;gap:10px;align-items:center"><button class="btn" id="srGo">Find articles</button><span id="srMsg" class="fsum" style="margin-left:0"></span></div></div>';
  $('srGo').onclick=()=>{
    const want=[...new Set($('srQ').value.toUpperCase().split(/[\s,;]+/).filter(Boolean))];
    if(!want.length){$('srMsg').textContent='Paste at least one article number.';return}
    if(!D.artIndex){D.artIndex=new Map();for(let i=0;i<D.N;i++)if(D.keep[i])D.artIndex.set(D.C.art[i].toUpperCase(),i)}
    const found=[],miss=[];want.forEach(a=>{const i=D.artIndex.get(a);if(i===undefined)miss.push(a);else found.push(i)});
    $('srMsg').textContent=fmt(found.length)+' found'+(miss.length?', '+fmt(miss.length)+' not in the data: '+miss.slice(0,8).join(', ')+(miss.length>8?' …':''):'');
    if(found.length)openList('Article search',found);
  };
}

/* =====================================================================
   BOOT
   ===================================================================== */
$('btnReload').onclick=()=>location.reload();
$('btnRebuild').onclick=async()=>{
  const b=$('btnRebuild');b.disabled=true;b.textContent='Rebuilding…';
  try{const r=await getJSON(API_URL+'?action=rebuild');const x=r.rebuild||{};
    alert(x.busy?'A rebuild is already running. Try again in a few minutes.':
      'Rebuilt: '+((x.built||[]).join(', ')||'none')+'\nUnchanged: '+((x.unchanged||[]).join(', ')||'none')+
      ((x.failed||[]).length?'\nFailed: '+x.failed.join('; '):'')+(x.continuing?'\nMore sheets will be rebuilt in the next few minutes.':'')+'\n\nThe page will now reload.');
    location.reload();
  }catch(e){alert('Rebuild failed: '+e.message);b.disabled=false;b.textContent='Rebuild from sheets'}
};
loadAll().catch(e=>{$('loader').hidden=false;$('loadErr').textContent=e.message||String(e)});
</script>
